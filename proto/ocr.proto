syntax = "proto3";

package chayan.ocr;

option go_package = "github.com/ChayanAI/services/proto/ocr";

// OCR Service — extracts raw text from document images.
service OCRService {
  rpc ExtractText (OCRRequest) returns (OCRResponse);
  rpc DetectLayout (LayoutRequest) returns (LayoutResponse);
}

message OCRRequest {
  bytes image_data = 1;           // Preprocessed image bytes
  string language = 2;            // "en", "hi", "te", etc.
  string hint = 3;                // Optional hint (e.g. "aadhaar_front")
  bool spotting = 4;              // Flag to indicate whether to perform localized spotting
}

message TextBlock {
  string text = 1;
  float confidence = 2;
}

message OCRResponse {
  string raw_text = 1;            // Full OCR text output
  float confidence = 2;           // Overall OCR confidence (0.0 - 1.0)
  bool success = 3;
  string error = 4;
  repeated TextBlock blocks = 5;  // Detailed per-box text and confidence
  string xml_layout = 6;          // Layout reconstructed into XML tags
}

message LayoutRequest {
  bytes image_data = 1;
}

message LayoutBox {
  int32 xmin = 1;
  int32 ymin = 2;
  int32 xmax = 3;
  int32 ymax = 4;
  string label = 5;
  float score = 6;
}

message LayoutResponse {
  bool success = 1;
  string error = 2;
  repeated LayoutBox layouts = 3;
}

