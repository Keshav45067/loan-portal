syntax = "proto3";

package chayan.common;

option go_package = "github.com/ChayanAI/services/proto/common";

// Empty message for RPCs that need no input
message Empty {}

// Standard health check
service Health {
  rpc Check (HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string version = 2;
  string uptime_seconds = 3;
}
