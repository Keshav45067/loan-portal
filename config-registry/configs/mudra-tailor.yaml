# ================================================================
# Mudra Loan — Tailor Scheme Configuration
# ================================================================
extends: base-mudra
scheme_id: mudra-tailor
display_name: "Mudra Loan - Tailor"

interview_graph:
  nodes:
    START:
      text_template: "माइक्रो लोन सेवा में आपका स्वागत है। मैं, आपके सिलाई की दुकान के काम में आपको आगे बढ़ाने के लिए जो लोन चाहिए, उसके बारे में बात कर रही हूँ। आपको जो कर्ज चाहिए, उसे जल्दी दिलाने के लिए मुझे आपसे थोड़ी जानकारी लेनी है। जैसे यह कर्ज किस काम में लगेगा, पैसा कहाँ खर्च होगा, और उससे बिक्री कितनी बढ़ेगी। क्या आप बताने के लिए तैयार हैं?"

    DOC_AADHAAR_BACK:
      edges:
        - condition: "always"
          next: "Q_BIZ_TYPE"

    Q_BIZ_TYPE:
      type: "voice-qa"
      text_template: "क्या आप कोई व्यापार करते हैं या किसी कंपनी में नौकरी करते हैं?"
      targets: [employment_type]
      routing_prompt: "Evaluate if the user is doing business or a job/service. Set 'routing_decision' to 'YES' if they are doing business, 'NO' if they are doing a job/service."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "DOC_UDYAM"
        - condition: "routing_decision == 'NO'"
          next: "DOC_COMPANY_ID"
        - condition: "always"
          next: "Q_STATUS"

    DOC_UDYAM:
      type: "capture"
      document_id: "udyam"
      edges:
        - condition: "always"
          next: "Q_STATUS"

    DOC_COMPANY_ID:
      type: "capture"
      document_id: "company_id"
      edges:
        - condition: "always"
          next: "Q_STATUS"

    Q_STATUS:
      text_template: "अभी सिलाई का काम कैसा चल रहा है?"

    Q_INVENTORY:
      text_template: "अभी दुकान में जो कपड़ा, मशीनें और सामान है, उनकी कुल क़ीमत होगी?"

    Q_NEED_MACHINES:
      text_template: "क्या कोई नई सिलाई मशीन, मोटर, ओज़ार या और सामान भी लेना है?"
