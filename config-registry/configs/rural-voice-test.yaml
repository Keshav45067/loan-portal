# ================================================================
# Rural Livelihood & Micro-Enterprise Loan Scheme Configuration
# Dedicated Voice-Only Evaluation & Testing Scheme (No Document Capture)
# ================================================================

scheme_id: rural-voice-test
display_name: "Rural Livelihood & Micro-Enterprise Loan (Voice Evaluation Scheme)"
languages: [hi, en, mr, fr, ar]

default_applicant_placeholder:
  hi: "आवेदक"
  mr: "अर्जदार"
  en: "Applicant"
  fr: "Demandeur"
  ar: "مقدم الطلب"

# ─── TTS/STT Configuration ───
tts:
  hi:
    voice_name: "hi-IN-Neural2-A"
    engine: "google"
    sample_rate: 24000
  mr:
    voice_name: "mr-IN-Wavenet-A"
    engine: "google"
    sample_rate: 24000
  en:
    voice_name: "en-US-Neural2-F"
    engine: "google"
    sample_rate: 24000
  fr:
    voice_name: "fr-FR-Neural2-A"
    engine: "google"
    sample_rate: 24000
  ar:
    voice_name: "ar-XA-Wavenet-A"
    engine: "google"
    sample_rate: 24000

stt:
  hi:
    engine: "google"
    language_code: "hi-IN"
  mr:
    engine: "google"
    language_code: "mr-IN"
  en:
    engine: "google"
    language_code: "en-US"
  fr:
    engine: "google"
    language_code: "fr-FR"
  ar:
    engine: "google"
    language_code: "ar-XA"

# ─── Inactivity / Silence Nudge Configuration ───
inactivity_defaults:
  enabled: true
  default_timeout_seconds: 3.0
  max_nudges_per_node: 2
  decay_multiplier: 1.4

# ─── System Standard Voice Messages ───
system_voice_messages:
  hi:
    processing: "आपकी जानकारी प्रोसेस हो रही है। कृपया प्रतीक्षा करें।"
    fallback_nudges:
      - "क्या आपको मेरी आवाज़ आ रही है? आप आराम से अपनी बात बता सकते हैं।"
      - "कोई जल्दी नहीं है, कृपया थोड़ा विस्तार से बताएं।"
  mr:
    processing: "तुमची माहिती तपासली जात आहे. कृपया थोडी वाट पहा."
    fallback_nudges:
      - "तुम्हाला माझा आवाज येतोय का? तुम्ही सवडीने उत्तर देऊ शकता."
      - "काही घाई नाही, कृपया थोडे सविस्तर सांगा."
  en:
    processing: "Processing your details. Please wait a moment."
    fallback_nudges:
      - "Can you hear me clearly? Please feel free to take your time."
      - "No rush at all, please describe in a little more detail."
  fr:
    processing: "Traitement de vos informations en cours. Veuillez patienter."
    fallback_nudges:
      - "M'entendez-vous bien ? Prenez votre temps pour répondre."
  ar:
    processing: "جاري معالجة بياناتك. يرجى الانتظار."
    fallback_nudges:
      - "هل تسمعني بوضوح؟ لا تقلق، خذ وقتك الكامل في الإجابة."

# ─── Document Requirements (Explicitly Empty for 100% Voice Evaluation) ───
document_requirements: []

# ─── Interview Graph ───
interview_graph:
  start_node_id: "START"
  nodes:

    # ─── 1. Introduction & Consent ───
    START:
      type: "voice-qa"
      text_template: "नमस्ते! ग्रामीण आजीविका और स्वरोजगार लोन मूल्यांकन में आपका स्वागत है। हम आपके काम-धंधे और आमदनी के बारे में कुछ सरल सवाल पूछेंगे। क्या हम शुरू करें?"
      text_template_mr: "नमस्कार! ग्रामीण उपजीविका आणि सूक्ष्म व्यवसाय कर्ज मूल्यांकनात आपले स्वागत आहे. आम्ही आपल्या व्यवसायाविषयी आणि उत्पन्नाविषयी काही सोपे प्रश्न विचारू. आपण सुरुवात करूया का?"
      text_template_en: "Hello! Welcome to the Rural Livelihood and Enterprise Loan Assessment. We will ask a few questions regarding your work, business, and earnings. Shall we begin?"
      text_template_fr: "Bonjour ! Bienvenue dans l'évaluation de prêt pour les activités rurales. Nous allons vous poser quelques questions sur votre travail et vos revenus. Pouvons-nous commencer ?"
      text_template_ar: "مرحباً بك في تقييم القروض الريفية وتطوير الأعمال المصغرة. سنطرح بعض الأسئلة حول نشاطك ودخلك. هل نبدأ؟"
      targets: []
      edges:
        - condition: "always"
          next: "Q_APPLICANT_BASICS"

    # ─── 2. Applicant Basics & Family Earning Structure ───
    Q_APPLICANT_BASICS:
      type: "voice-qa"
      text_template: "कृपया अपना पूरा नाम, अपनी उम्र, और आपके परिवार में कुल कितने सदस्य हैं और उनमें से कितने लोग कमाते हैं, यह बताएं।"
      text_template_mr: "कृपया आपले पूर्ण नाव, वय, तसेच कुटुंबातील एकूण सदस्य आणि त्यांपैकी किती व्यक्ती कमावत्या आहेत, हे सांगा."
      text_template_en: "Please tell me your full name, age, the total number of members in your household, and how many of them are currently earning."
      text_template_fr: "Veuillez indiquer votre nom complet, votre âge, le nombre de personnes dans votre foyer et combien d'entre elles travaillent."
      text_template_ar: "يرجى ذكر اسمك الكامل، وعمرك، وإجمالي عدد أفراد أسرتك وكم منهم يعمل حالياً."
      targets: [applicant_name, age, family_members_count, earning_members_count]
      inactivity_policy:
        timeout_seconds: 3.5
        nudge_guideline: "Ask the user gently to share their name, age, total family members, and how many are earning."
      edges:
        - condition: "always"
          next: "Q_PRIMARY_OCCUPATION"

    # ─── 3. Primary Activity & Sector Classifier (Branching Hub) ───
    Q_PRIMARY_OCCUPATION:
      type: "voice-qa"
      text_template: "{applicant_name} जी, आप मुख्य रूप से क्या काम या व्यवसाय करते हैं, और आप यह काम कितने सालों से कर रहे हैं?"
      text_template_mr: "{applicant_name} जी, आपण मुख्यत्वे कोणता व्यवसाय किंवा काम करता, आणि हे काम आपण किती वर्षांपासून करत आहात?"
      text_template_en: "{applicant_name}, what is your primary business or occupation, and how many years have you been engaged in this activity?"
      text_template_fr: "{applicant_name}, quelle est votre activité principale ou entreprise, et depuis combien d'années l'exercez-vous ?"
      text_template_ar: "{applicant_name}، ما هو نشاطك التجاري أو عملك الأساسي، ومنذ كم سنة وأنت تعمل فيه؟"
      targets: [business_type, primary_activity, years_in_business]
      routing_prompt: "Classify the applicant's primary livelihood into one of these categories: 'LIVESTOCK' (dairy, cow, buffalo, goat, poultry, animal farming, agriculture), 'RETAIL' (kirana, grocery, shop, trading, clothing, vegetable/fruit vending, tea stall, tailoring), 'SERVICE' (auto/tempo/tractor transport, repair workshop, cycle/motor mechanic, electrical/welding), 'ARTISAN' (pottery, weaving, bamboo craft, food processing, pickle/papad, handicrafts). Set 'sector_code' to LIVESTOCK, RETAIL, SERVICE, or ARTISAN. If unclear or other, default to RETAIL."
      inactivity_policy:
        timeout_seconds: 3.0
        nudge_guideline: "Ask what their primary daily work or shop/farming activity is."
      edges:
        - condition: "sector_code == 'LIVESTOCK'"
          next: "Q_AGRI_LIVESTOCK"
        - condition: "business_type in ['dairy', 'goatry', 'poultry', 'farming', 'cattle', 'livestock', 'agriculture']"
          next: "Q_AGRI_LIVESTOCK"
        - condition: "sector_code == 'SERVICE'"
          next: "Q_TRANSPORT_SERVICE"
        - condition: "business_type in ['auto', 'transport', 'mechanic', 'repair', 'workshop', 'welding', 'electrician']"
          next: "Q_TRANSPORT_SERVICE"
        - condition: "sector_code == 'ARTISAN'"
          next: "Q_ARTISAN_PROCESSING"
        - condition: "business_type in ['artisan', 'handicraft', 'weaving', 'pottery', 'bamboo', 'food_processing', 'papad']"
          next: "Q_ARTISAN_PROCESSING"
        - condition: "always"
          next: "Q_RETAIL_TRADE"

    # ─── SECTOR A: Livestock / Farming Branch ───
    Q_AGRI_LIVESTOCK:
      type: "voice-qa"
      text_template: "आपके पास कुल कितने पशु या पक्षी हैं, रोज़ाना कितना दूध या उत्पादन मिलता है, और चारे-दाने पर रोज़ का कितना खर्च होता है?"
      text_template_mr: "आपल्याकडे एकूण किती जनावरे किंवा पक्षी आहेत, दररोज किती दूध किंवा उत्पादन मिळते, आणि चाऱ्यासाठी रोजचा किती खर्च होतो?"
      text_template_en: "How many cattle or animals do you have, what is your daily milk or produce yield, and how much do you spend daily on animal feed/fodder?"
      text_template_fr: "Combien d'animaux possédez-vous, quelle est votre production quotidienne de lait ou autre, et quel est le coût journalier de leur nourriture ?"
      text_template_ar: "كم عدد المواشي أو الطيور لديك، وما هو الإنتاج اليومي من الحليب أو المنتجات، وكم تنفق يومياً على العلف؟"
      targets: [animal_count, daily_yield_liters, daily_feed_cost]
      routing_prompt: "Evaluate if the applicant has mentioned whether they own a shed/shelter or if they need shelter facilities. Set 'has_shade' to 'YES' if they own a shed, 'NO' if not mentioned or they graze outside."
      edges:
        - condition: "has_shade == 'YES'"
          next: "Q_AGRI_SHED_DETAILS"
        - condition: "always"
          next: "Q_AGRI_GRAZING"

    Q_AGRI_SHED_DETAILS:
      type: "voice-qa"
      text_template: "जो शेड या बाड़ा आपके पास है, वह खुद की ज़मीन पर है या किराए पर? और वहां पानी और बिजली की क्या व्यवस्था है?"
      text_template_mr: "आपल्याकडे असलेला शेड स्वतःच्या जागेवर आहे की भाड्याने? आणि तिथे पाणी आणि विजेची काय सोय आहे?"
      text_template_en: "Is the animal shed on your own land or rented? What arrangements do you have for water and electricity there?"
      text_template_fr: "L'abri pour animaux est-il sur votre propre terrain ou loué ? Quelles sont les installations pour l'eau et l'électricité ?"
      text_template_ar: "هل حظيرة المواشي على أرض ملكك أم مستأجرة؟ وما هي الترتيبات المتوفرة للمياه والكهرباء؟"
      targets: [shed_ownership, shed_utilities_details]
      edges:
        - condition: "always"
          next: "Q_SEASONAL_CASHFLOW"

    Q_AGRI_GRAZING:
      type: "voice-qa"
      text_template: "पशुओं को चराने या रखने की क्या व्यवस्था है, और क्या हरे चारे के लिए आपके पास अपनी खेती या लीज़ की ज़मीन है?"
      text_template_mr: "जनावरांना चरण्यासाठी किंवा ठेवण्यासाठी काय सोय आहे, आणि हिरव्या चाऱ्यासाठी आपली स्वतःची किंवा भाडेतत्त्वावरील शेती आहे का?"
      text_template_en: "What arrangement do you have for animal grazing/shelter, and do you own or lease any farmland for green fodder?"
      text_template_fr: "Comment gérez-vous le pâturage de vos bêtes, et disposez-vous de terres agricoles en propriété ou en location pour le fourrage ?"
      text_template_ar: "ما هي ترتيبات الرعي والمأوى للمواشي، وهل تمتلك أو تستأجر أرضاً زراعية للأعلاف؟"
      targets: [grazing_arrangement, land_ownership_type]
      edges:
        - condition: "always"
          next: "Q_SEASONAL_CASHFLOW"

    # ─── SECTOR B: Rural Retail & Trade Branch ───
    Q_RETAIL_TRADE:
      type: "voice-qa"
      text_template: "आपकी दुकान या बिक्री की जगह अपनी है या किराए की? रोज़ाना औसतन कितने ग्राहक आते हैं और दिन भर में कुल कितने रुपये की बिक्री (गल्ला) होती है?"
      text_template_mr: "आपले दुकान स्वतःच्या जागेत आहे की भाड्याच्या? रोज सरासरी किती ग्राहक येतात आणि दिवसाला अंदाजे किती रुपयांची विक्री होते?"
      text_template_en: "Is your shop or vending space owned or rented? On average, how many customers visit daily and what is your total daily sales turnover?"
      text_template_fr: "Votre boutique ou local est-il à vous ou en location ? Combien de clients avez-vous par jour et quel est votre chiffre d'affaires quotidien ?"
      text_template_ar: "هل محلك التجاري ملك أم إيجار؟ وكم عدد الزبائن يومياً وما هو إجمالي مبيعاتك اليومية؟"
      targets: [shop_ownership, daily_customers_count, daily_sales_turnover]
      edges:
        - condition: "always"
          next: "Q_RETAIL_STOCK"

    Q_RETAIL_STOCK:
      type: "voice-qa"
      text_template: "दुकान में इस समय लगभग कितने रुपये का सामान या स्टॉक भरा हुआ है? और क्या आप ग्राहकों को उधारी देते हैं? उधारी का पैसा कितने दिनों में लौटता है?"
      text_template_mr: "दुकानात सध्या अंदाजे किती रुपयांचा माल भरलेला आहे? आणि ग्राहकांना उधारी देता का? उधारीचे पैसे किती दिवसांत परत मिळतात?"
      text_template_en: "Approximately what is the total value of stock/inventory in your shop right now? Do you offer customer credit (udhaari), and in how many days is it usually repaid?"
      text_template_fr: "Quelle est la valeur approximative de votre stock actuel ? Accordez-vous du crédit à vos clients et sous combien de jours est-il remboursé ?"
      text_template_ar: "ما هي القيمة التقريبية للبضاعة والمخزون في المحل حالياً؟ وهل تبيع بالآجل للعملاء وخلال كم يوم يتم السداد؟"
      targets: [inventory_current_value, customer_credit_amount, credit_cycle_days]
      edges:
        - condition: "always"
          next: "Q_SEASONAL_CASHFLOW"

    # ─── SECTOR C: Rural Transport & Services Branch ───
    Q_TRANSPORT_SERVICE:
      type: "voice-qa"
      text_template: "जो वाहन, ट्रैक्टर या औज़ार आप इस्तेमाल करते हैं, वह आपके खुद के नाम पर है या किसी और का? रोज़ाना कितने चक्कर या काम मिलते हैं और दिन का डीज़ल-पेट्रोल खर्च कितना आता है?"
      text_template_mr: "आपण जे वाहन किंवा अवजारे वापरता, ते आपल्या स्वतःच्या नावावर आहेत का? रोजच्या किती फेऱ्या होतात आणि रोजचा डिझेल-पेट्रोलचा खर्च किती होतो?"
      text_template_en: "Is the vehicle, equipment, or machinery registered in your own name? How many trips or jobs do you complete daily, and what is your daily fuel cost?"
      text_template_fr: "Le véhicule ou matériel que vous utilisez est-il à votre nom ? Combien de courses ou travaux faites-vous par jour et quel est le coût journalier du carburant ?"
      text_template_ar: "هل المركبة أو المعدات مسجلة باسمك؟ وكم عدد الرحلات أو الأعمال التي تنجزها يومياً وما هي تكلفة الوقود اليومية؟"
      targets: [vehicle_equipment_ownership, daily_trips_or_jobs, daily_fuel_expense]
      edges:
        - condition: "always"
          next: "Q_SERVICE_ASSET"

    Q_SERVICE_ASSET:
      type: "voice-qa"
      text_template: "आपके इस वाहन या मशीनरी की उम्र कितनी है, और महीने में रिपेयरिंग या मेंटेनेंस पर औसतन कितना खर्च बैठता है?"
      text_template_mr: "आपल्या या वाहनाचे किंवा मशीनचे वय किती आहे, आणि दरमहा दुरुस्ती-देखभालीवर अंदाजे किती खर्च होतो?"
      text_template_en: "How old is this vehicle or machine, and how much do you spend on repairs and maintenance in an average month?"
      text_template_fr: "Quel est l'âge de ce véhicule ou équipement, et combien dépensez-vous par mois en réparations et entretien ?"
      text_template_ar: "كم عمر هذه المركبة أو الآلة، وكم تنفق تقريباً كل شهر على الصيانة والإصلاحات؟"
      targets: [asset_age_years, monthly_maintenance_cost]
      edges:
        - condition: "always"
          next: "Q_SEASONAL_CASHFLOW"

    # ─── SECTOR D: Artisanal & Micro-Processing Branch ───
    Q_ARTISAN_PROCESSING:
      type: "voice-qa"
      text_template: "काम के लिए कच्चा माल (जैसे धागा, मिट्टी, अनाज, सामग्री) आप कहाँ से लाते हैं? एक बैच या लॉट तैयार करने में कितनी लागत और कितने दिन का समय लगता है?"
      text_template_mr: "कामासाठी लागणारा कच्चा माल (उदा. धागा, माती, धान्य) आपण कुठून आणता? एक बॅच किंवा माल तयार करण्यासाठी किती खर्च आणि किती दिवस लागतात?"
      text_template_en: "Where do you procure raw materials (e.g. yarn, clay, grain, supplies)? How much does one batch cost and how many days does it take to prepare?"
      text_template_fr: "Où achetez-vous vos matières premières ? Quel est le coût de fabrication d'un lot et combien de jours cela prend-il ?"
      text_template_ar: "من أين تشتري المواد الخام الأولية؟ وكم تبلغ تكلفة إنتاج الدفعة الواحدة وكم يوماً تستغرق؟"
      targets: [raw_material_source, batch_production_cost, batch_cycle_days]
      edges:
        - condition: "always"
          next: "Q_ARTISAN_MARKET"

    Q_ARTISAN_MARKET:
      type: "voice-qa"
      text_template: "तैयार माल आप सीधे ग्राहकों या हाट-बाज़ार में बेचते हैं या किसी व्यापारी/बिचौलिए को? और क्या त्योहारों या खास महीनों में बिक्री कई गुना बढ़ जाती है?"
      text_template_mr: "तयार माल आपण थेट ग्राहकांना/आठवडे बाजारात विकता की व्यापाऱ्याला? आणि सणासुदीच्या दिवसांत विक्री वाढते का?"
      text_template_en: "Do you sell finished goods directly in local weekly markets (haat) or to middlemen/dealers? Does your sale multiply during festivals or specific seasons?"
      text_template_fr: "Vendez-vous directement sur les marchés locaux ou à des intermédiaires ? Vos ventes augmentent-elles fortement pendant les fêtes ?"
      text_template_ar: "هل تبيع المنتجات مباشرة في الأسواق المحلية للزبائن أم للتجار والوسطاء؟ وهل تتضاعف المبيعات في المواسم والأعياد؟"
      targets: [sales_channel, festival_sales_surge_multiplier]
      edges:
        - condition: "always"
          next: "Q_SEASONAL_CASHFLOW"

    # ─── 4. Reconvergence: Seasonal Cash Flows (High Ambiguity & Follow-ups) ───
    Q_SEASONAL_CASHFLOW:
      type: "voice-qa"
      text_template: "अच्छे सीज़न या त्योहार के महीनों में आपकी महीने की कुल कमाई कितनी हो जाती है, और जब काम हल्का या मंदा रहता है (जैसे बरसात या ऑफ-सीज़न), तब महीने का कितना बच पाता है?"
      text_template_mr: "चांगल्या हंगामात किंवा सणांच्या काळात महिन्याला किती कमाई होते, आणि काम कमी असताना (उदा. पावसाळ्यात) महिन्याला किती शिल्लक राहते?"
      text_template_en: "During peak season or festival months, what is your total monthly earning, and during the lean/slow months (like rainy season), how much do you manage to earn?"
      text_template_fr: "Pendant la haute saison ou les périodes de fête, quel est votre revenu mensuel total, et pendant les mois creux, combien gagnez-vous ?"
      text_template_ar: "في مواسم الذروة والأعياد، كم يبلغ إجمالي دخلك الشهري، وفي الأشهر الهادئة أو الضعيفة، كم يتبقى لك تقريباً؟"
      targets: [peak_monthly_revenue, lean_monthly_revenue, lean_months_count]
      inactivity_policy:
        timeout_seconds: 3.5
        nudge_guideline: "Ask clearly for their earnings in both the best months and the slow months."
      edges:
        - condition: "always"
          next: "Q_EXPENSES_BREAKDOWN"

    # ─── 5. Expense Breakdown: Business Running Costs vs Household Needs ───
    Q_EXPENSES_BREAKDOWN:
      type: "voice-qa"
      text_template: "काम-धंधे में हर महीने का कुल खर्च (जैसे किराया, मजदूरी, बिजली, माल) कितना हो जाता है? और घर के राशन, बच्चों की पढ़ाई और दवाइयों में हर महीने लगभग कितना खर्च होता है?"
      text_template_mr: "व्यवसायात दरमहा एकूण खर्च (भाडे, मजुरी, वीज, माल) किती होतो? आणि घरखर्च, मुलांचे शिक्षण आणि औषधोपचारासाठी दरमहा किती खर्च होतो?"
      text_template_en: "What are your total monthly business operating expenses (rent, wages, electricity, supplies)? And roughly how much do you spend monthly on household groceries, school fees, and medical needs?"
      text_template_fr: "Quelles sont vos dépenses mensuelles professionnelles totales (loyer, salaires, électricité) ? Et combien dépensez-vous par mois pour les besoins du foyer (nourriture, école, santé) ?"
      text_template_ar: "ما هي مصاريف عملك الشهرية الإجمالية (إيجار، عمالة، كهرباء، بضاعة)؟ وكم تبلغ مصاريف منزلك الشهرية تقريباً (طعام، دراسة، علاج)؟"
      targets: [monthly_business_expense, monthly_household_expense, number_of_hired_workers]
      inactivity_policy:
        timeout_seconds: 3.5
        nudge_guideline: "Ask for both business running costs and personal family household monthly expenses."
      edges:
        - condition: "always"
          next: "Q_EXISTING_DEBT"

    # ─── 6. Existing Debt & Informal Credit (SHG, Moneylender, Bank) ───
    Q_EXISTING_DEBT:
      type: "voice-qa"
      text_template: "क्या आपके या आपके परिवार पर पहले से कोई लोन चल रहा है — जैसे बैंक, स्वयं सहायता समूह (SHG), किसी माइक्रोफाइनेंस कंपनी या साहूकार से? अगर हाँ, तो हर महीने कितनी किश्त (EMI) भरते हैं?"
      text_template_mr: "आपल्यावर किंवा कुटुंबावर आधीपासून कोणते कर्ज चालू आहे का — जसे बँक, बचत गट (SHG), मायक्रोफायनान्स किंवा सावकाराचे? असल्यास, दरमहा किती हप्ता (EMI) भरता?"
      text_template_en: "Do you or your family have any existing loans running — such as from a Bank, Self Help Group (SHG), Microfinance company, or local moneylender? If yes, what is your total monthly EMI?"
      text_template_fr: "Avez-vous, vous ou votre famille, des crédits en cours (banque, groupe d'entraide, microfinance ou prêteur privé) ? Si oui, quel est le montant total de vos mensualités ?"
      text_template_ar: "هل لديك أو لدى أسرتك أي قروض قائمة حالياً (من بنك، جمعية نسائية/محلية، شركة تمويل مصغر أو جهة خاصة)؟ وإذا كان نعم، كم هو القسط الشهري الإجمالي؟"
      targets: [has_existing_loan, existing_loan_source, existing_loan_outstanding, existing_monthly_emi]
      inactivity_policy:
        timeout_seconds: 3.5
        nudge_guideline: "Ask if they have any ongoing loan from SHG, bank or moneylender and the monthly EMI."
      edges:
        - condition: "always"
          next: "Q_LOAN_REQUIREMENT"

    # ─── 7. Loan Amount & Purpose Identification ───
    Q_LOAN_REQUIREMENT:
      type: "voice-qa"
      text_template: "आपको इस नए लोन में कुल कितने रुपये की ज़रूरत है, और इस पैसे का इस्तेमाल आप किस चीज़ में करेंगे — कोई नई मशीन या औज़ार खरीदने में, माल/स्टॉक भरने में, या दुकान बढ़ाने में?"
      text_template_mr: "आपल्याला या कर्जासाठी एकूण किती रकमेची गरज आहे, आणि हा पैसा आपण कशासाठी वापरणार — नवीन मशीन/अवजारे खरेदी, कच्चा माल भरणे की व्यवसाय विस्तार?"
      text_template_en: "How much total loan amount do you require, and specifically how will you utilize this money — purchasing new machinery/equipment, stocking inventory, or expanding your setup?"
      text_template_fr: "De quel montant total de prêt avez-vous besoin, et à quoi servira exactement cet argent (achat de matériel/machine, stock de marchandises ou extension) ?"
      text_template_ar: "ما هو إجمالي مبلغ القرض الذي تطلبه، وفي ماذا ستستخدم هذا المبلغ بالتحديد (شراء آلات/معدات، بضاعة ومخزون، أم توسعة النشاط)؟"
      targets: [loan_amount_requested, loan_purpose_category, loan_utilization_details]
      routing_prompt: "Classify the loan requirement into 'ASSET' (purchasing machinery, vehicle, cattle, equipment, shed construction) or 'WORKING_CAPITAL' (buying stock, raw materials, goods, paying running expenses). Set 'loan_type' to ASSET or WORKING_CAPITAL."
      inactivity_policy:
        timeout_seconds: 3.5
        nudge_guideline: "Ask for the exact loan amount required and what specific items they plan to purchase."
      edges:
        - condition: "loan_type == 'ASSET'"
          next: "Q_ASSET_QUOTE"
        - condition: "loan_purpose_category in ['machine', 'equipment', 'cattle', 'vehicle', 'asset', 'shed']"
          next: "Q_ASSET_QUOTE"
        - condition: "always"
          next: "Q_WORKING_CAPITAL_CYCLE"

    # ─── 8A. Asset Purchase Sub-branch ───
    Q_ASSET_QUOTE:
      type: "voice-qa"
      text_template: "जो मशीन, वाहन या सामान आप खरीदना चाहते हैं, क्या उसका भाव या कोटेशन पता कर लिया है? उसकी कुल कीमत कितनी है, और क्या आप अपनी जेब से भी कुछ पैसा (मार्जिन) लगाएंगे?"
      text_template_mr: "जी मशीन किंवा साहित्य आपण खरेदी करणार आहात, त्याची अंदाजे किंमत किती आहे? आणि त्यात स्वतःकडील काही रक्कम (मार्जिन) घालणार आहात का?"
      text_template_en: "Have you obtained an estimate or quotation for the machine/equipment you wish to purchase? What is its total cost, and will you contribute any margin money from your own savings?"
      text_template_fr: "Avez-vous un devis pour la machine ou l'équipement souhaité ? Quel est son coût total, et apporterez-vous un apport personnel ?"
      text_template_ar: "هل استفسرت عن سعر أو عرض أسعار الآلة/المعدات التي ترغب بشرائها؟ كم سعرها الإجمالي، وهل ستدفع دفعة أولى من مدخراتك؟"
      targets: [target_asset_name, asset_quotation_amount, own_margin_contribution]
      edges:
        - condition: "always"
          next: "Q_REPAYMENT_PLAN"

    # ─── 8B. Working Capital Sub-branch ───
    Q_WORKING_CAPITAL_CYCLE:
      type: "voice-qa"
      text_template: "जो नया माल या स्टॉक आप इस लोन से भरेंगे, वह कितने हफ़्तों या महीनों में बिक कर खाली हो जाता है? और उस पर आपको कितने प्रतिशत का मुनाफा (प्रॉफिट मार्जिन) मिलता है?"
      text_template_mr: "या कर्जातून जो नवीन माल आपण भरणार आहात, तो किती आठवड्यांत किंवा महिन्यांत खपतो? आणि त्यावर आपल्याला अंदाजे किती टक्के नफा मिळतो?"
      text_template_en: "How many weeks or months does it take for your newly purchased stock to sell out completely? And what percentage of profit margin do you earn on these goods?"
      text_template_fr: "En combien de semaines ou mois votre stock de marchandises se vend-il entièrement ? Et quelle est votre marge bénéficiaire en pourcentage sur ces produits ?"
      text_template_ar: "خلال كم أسبوع أو شهر يتم بيع وتصريف البضاعة الجديدة بالكامل؟ وما هي نسبة هامش الربح التقريبية التي تكسبها؟"
      targets: [stock_rotation_days, expected_profit_margin_pct]
      edges:
        - condition: "always"
          next: "Q_REPAYMENT_PLAN"

    # ─── 9. Repayment Capacity & Incremental Income ───
    Q_REPAYMENT_PLAN:
      type: "voice-qa"
      text_template: "इस लोन और नए काम के शुरू होने के बाद, हर महीने आपकी कमाई में कितने रुपये की बढ़ोतरी की उम्मीद है? और आप आराम से हर महीने कितनी किश्त (EMI) भर सकेंगे?"
      text_template_mr: "हे कर्ज आणि नवीन विस्तार सुरू झाल्यानंतर, आपल्या दरमहा कमाईत किती रुपयांची वाढ अपेक्षित आहे? आणि आपण सहजपणे दरमहा किती रुपयांचा हप्ता (EMI) भरू शकाल?"
      text_template_en: "After utilizing this loan, by how many rupees do you expect your monthly net earnings to increase? And how much monthly EMI can you comfortably afford to pay back?"
      text_template_fr: "Après l'utilisation de ce prêt, de combien prévoyez-vous l'augmentation de vos revenus nets mensuels ? Et quel montant de mensualité pouvez-vous rembourser sans difficulté ?"
      text_template_ar: "بعد الاستفادة من هذا القرض وتوسعة العمل، كم تتوقع أن تزيد أرباحك الشهرية بالتقريب؟ وكم تبلغ قيمة القسط الشهري الذي تستطيع سداده براحة ودون تعثر؟"
      targets: [expected_incremental_income, affordable_monthly_emi, preferred_loan_tenure_months]
      inactivity_policy:
        timeout_seconds: 3.5
        nudge_guideline: "Ask for their expected income increase and comfortable monthly EMI amount."
      edges:
        - condition: "always"
          next: "Q_CO_BORROWER"

    # ─── 10. Co-Borrower / Family Guarantor Consent ───
    Q_CO_BORROWER:
      type: "voice-qa"
      text_template: "लोन में आपके साथ सह-आवेदक (Co-borrower या गारंटर) के रूप में परिवार से कौन जुड़ेगा — जैसे पति/पत्नी या माता-पिता? क्या उनका भी कोई अलग काम या आमदनी है?"
      text_template_mr: "कर्जात आपल्यासोबत सह-अर्जदार (Co-borrower) म्हणून कुटुंबातील कोणती व्यक्ती जोडली जाईल — जोडीदार किंवा पालक? त्यांचेही काही वेगळे उत्पन्न आहे का?"
      text_template_en: "Who from your family will join as a co-borrower or guarantor — such as your spouse or parents? Do they have any independent livelihood or income?"
      text_template_fr: "Qui de votre famille sera co-emprunteur ou garant (conjoint, parent) ? A-t-il/elle une activité ou un revenu propre ?"
      text_template_ar: "من من أفراد أسرتك سيكون شريكاً أو ضامناً في القرض (الزوج/الزوجة أو أحد الوالدين)؟ وهل لديه دخل أو عمل مستقل؟"
      targets: [co_borrower_relation, co_borrower_name, co_borrower_income]
      inactivity_policy:
        timeout_seconds: 3.0
        nudge_guideline: "Ask who in the family will be co-applicant and whether they have income."
      edges:
        - condition: "always"
          next: "END_SUMMARY"

    # ─── 11. Final Wrap-up & Evaluation Confirmation ───
    END_SUMMARY:
      type: "voice-qa"
      text_template: "बहुत-बहुत धन्यवाद {applicant_name} जी! आपके व्यवसाय, आमदनी और लोन की सभी आवश्यक बातें सफलतापूर्वक रिकॉर्ड कर ली गई हैं। हमारा सिस्टम आपके जवाबों की समीक्षा कर रहा है। आपका दिन शुभ हो!"
      text_template_mr: "धन्यवाद {applicant_name} जी! आपल्या व्यवसायाची आणि कर्जाची सर्व आवश्यक माहिती यशस्वीरित्या नोंदवली गेली आहे. आमची यंत्रणा आपल्या उत्तरांचे मूल्यांकन करत आहे. आपला दिवस चांगला जावो!"
      text_template_en: "Thank you very much {applicant_name}! All necessary details regarding your livelihood, revenue, and loan requirement have been successfully captured. Have a wonderful day!"
      text_template_fr: "Merci beaucoup {applicant_name} ! Toutes les informations nécessaires sur votre activité et votre demande de prêt ont été enregistrées avec succès. Bonne journée !"
      text_template_ar: "شكراً جزيلاً لك {applicant_name}! تم تسجيل جميع بيانات نشاطك ودخلك وطلب القرض بنجاح. نتمنى لك يوماً سعيداً وموفقاً!"
      targets: []
      edges:
        - condition: "always"
          next: "END"

  # ─── Context Map (Dependencies for Conversational Grounding) ───
  context_map:
    Q_PRIMARY_OCCUPATION:
      - "Q_APPLICANT_BASICS"
    Q_AGRI_LIVESTOCK:
      - "Q_PRIMARY_OCCUPATION"
    Q_AGRI_SHED_DETAILS:
      - "Q_AGRI_LIVESTOCK"
    Q_AGRI_GRAZING:
      - "Q_AGRI_LIVESTOCK"
    Q_RETAIL_TRADE:
      - "Q_PRIMARY_OCCUPATION"
    Q_RETAIL_STOCK:
      - "Q_RETAIL_TRADE"
    Q_TRANSPORT_SERVICE:
      - "Q_PRIMARY_OCCUPATION"
    Q_SERVICE_ASSET:
      - "Q_TRANSPORT_SERVICE"
    Q_ARTISAN_PROCESSING:
      - "Q_PRIMARY_OCCUPATION"
    Q_ARTISAN_MARKET:
      - "Q_ARTISAN_PROCESSING"
    Q_SEASONAL_CASHFLOW:
      - "Q_PRIMARY_OCCUPATION"
      - "Q_RETAIL_TRADE"
      - "Q_AGRI_LIVESTOCK"
      - "Q_TRANSPORT_SERVICE"
      - "Q_ARTISAN_PROCESSING"
    Q_EXPENSES_BREAKDOWN:
      - "Q_SEASONAL_CASHFLOW"
    Q_EXISTING_DEBT:
      - "Q_EXPENSES_BREAKDOWN"
    Q_LOAN_REQUIREMENT:
      - "Q_PRIMARY_OCCUPATION"
      - "Q_EXPENSES_BREAKDOWN"
    Q_ASSET_QUOTE:
      - "Q_LOAN_REQUIREMENT"
    Q_WORKING_CAPITAL_CYCLE:
      - "Q_LOAN_REQUIREMENT"
    Q_REPAYMENT_PLAN:
      - "Q_LOAN_REQUIREMENT"
      - "Q_EXPENSES_BREAKDOWN"
      - "Q_SEASONAL_CASHFLOW"
    Q_CO_BORROWER:
      - "Q_APPLICANT_BASICS"
    END_SUMMARY:
      - "Q_APPLICANT_BASICS"
      - "Q_LOAN_REQUIREMENT"

# ─── Field Extraction Instructions (Used by Task B Extraction Worker) ───
field_instructions:
  applicant_name:
    instruction: "Extract the applicant's full formal name as spoken in the response."
  age:
    instruction: "Extract the applicant's age as an integer number of years (between 18 and 80)."
  family_members_count:
    instruction: "Extract the total number of family members living in the household."
  earning_members_count:
    instruction: "Extract the number of people in the family who actively earn an income."
  business_type:
    instruction: "Extract a standardized lowercase business category keyword (e.g. dairy, goatry, poultry, kirana, retail, tailoring, auto, transport, mechanic, artisan, weaving, food_processing)."
  primary_activity:
    instruction: "Extract a concise descriptive phrase of what the user does for a living."
  years_in_business:
    instruction: "Extract how many years the applicant has been doing this work as a number."
  animal_count:
    instruction: "Extract the total number of livestock/cattle/poultry owned as an integer."
  daily_yield_liters:
    instruction: "Extract the daily milk or produce yield (in liters or units) as a numeric value."
  daily_feed_cost:
    instruction: "Extract the daily fodder/feed expense in Rupees as a number."
  shed_ownership:
    instruction: "Extract 'OWNED', 'RENTED', 'LEASED', or 'NONE' regarding animal shelter/shed."
  shed_utilities_details:
    instruction: "Extract water and electricity availability details for the animal shed."
  grazing_arrangement:
    instruction: "Extract how the animals are grazed or fed if no permanent shed is available."
  land_ownership_type:
    instruction: "Extract farmland ownership status: 'OWNED', 'LEASED', 'SHARECROPPING', or 'NONE'."
  shop_ownership:
    instruction: "Extract 'OWNED', 'RENTED', or 'STREET_VENDING' for the commercial premises."
  daily_customers_count:
    instruction: "Extract the approximate daily customer footfall as an integer."
  daily_sales_turnover:
    instruction: "Extract average gross daily sales turnover in Rupees as a number."
  inventory_current_value:
    instruction: "Extract the estimated total value of current inventory/stock in Rupees."
  customer_credit_amount:
    instruction: "Extract the outstanding udhaari (credit given to village customers) in Rupees."
  credit_cycle_days:
    instruction: "Extract the average credit recovery period in days."
  vehicle_equipment_ownership:
    instruction: "Extract whether key work vehicle/machinery is 'OWNED', 'FINANCED', or 'RENTED'."
  daily_trips_or_jobs:
    instruction: "Extract the daily number of trips or service jobs completed."
  daily_fuel_expense:
    instruction: "Extract daily fuel/diesel/petrol expenses in Rupees."
  asset_age_years:
    instruction: "Extract the age of the machinery/vehicle in years."
  monthly_maintenance_cost:
    instruction: "Extract average monthly servicing and repair expenses in Rupees."
  raw_material_source:
    instruction: "Extract where raw materials are sourced (e.g. local mandi, wholesale city market, forest)."
  batch_production_cost:
    instruction: "Extract the monetary cost required to produce one batch of goods in Rupees."
  batch_cycle_days:
    instruction: "Extract the number of days taken to finish one batch."
  sales_channel:
    instruction: "Extract whether goods are sold 'DIRECT_TO_CONSUMER', 'LOCAL_HAAT', or 'MIDDLEMEN'."
  festival_sales_surge_multiplier:
    instruction: "Extract how many times sales increase during peak festival seasons (e.g. 2x, 3x)."
  peak_monthly_revenue:
    instruction: "Extract the peak monthly income/revenue in Rupees during best months."
  lean_monthly_revenue:
    instruction: "Extract the monthly income/revenue in Rupees during slowest/lean months."
  lean_months_count:
    instruction: "Extract how many months in a year are considered lean/slow."
  monthly_business_expense:
    instruction: "Extract total monthly recurring business operational expenditure in Rupees."
  monthly_household_expense:
    instruction: "Extract total monthly household personal living expenditure in Rupees."
  number_of_hired_workers:
    instruction: "Extract the number of paid outside workers/helpers hired."
  has_existing_loan:
    instruction: "Extract 'YES' if borrower has any active loan, else 'NO'."
  existing_loan_source:
    instruction: "Extract the lender source (e.g. 'SHG', 'BANK', 'MFI', 'SAHUKAAR', 'NONE')."
  existing_loan_outstanding:
    instruction: "Extract remaining loan principal outstanding in Rupees."
  existing_monthly_emi:
    instruction: "Extract total current monthly installment (EMI) paid in Rupees."
  loan_amount_requested:
    instruction: "Extract the total loan amount requested by the applicant in Rupees."
  loan_purpose_category:
    instruction: "Extract categorized intent: 'ASSET_PURCHASE', 'WORKING_CAPITAL', 'EXPANSION', or 'DEBT_REFINANCE'."
  loan_utilization_details:
    instruction: "Extract specific descriptive plan for using the loan funds."
  target_asset_name:
    instruction: "Extract the specific asset or machine the borrower wants to buy."
  asset_quotation_amount:
    instruction: "Extract the total purchase price/quotation of the new asset in Rupees."
