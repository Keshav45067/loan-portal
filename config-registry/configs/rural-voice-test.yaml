# ================================================================
# Rural Voice Evaluation Scheme (Pure Voice QA - Mudra Questions)
# Excludes: All document captures, video capture, manual filling,
#           Q_NAME_CONFIRMATION, and Q_SPOUSE_PHONE
# ================================================================

scheme_id: rural-voice-test
display_name: "Rural Voice Evaluation Scheme"
languages: [hi, en, mr, fr, ar]

# ─── TTS/STT Configuration ───
tts:
  hi:
    voice_name: "hi-IN-Neural2-A"
    engine: "google"
    sample_rate: 24000
  mr:
    voice_name: "mr-IN-Wavenet-A"
    engine: "google"
    sample_rate: 24000
  en:
    voice_name: "en-US-Neural2-F"
    engine: "google"
    sample_rate: 24000
  fr:
    voice_name: "fr-FR-Neural2-A"
    engine: "google"
    sample_rate: 24000
  ar:
    voice_name: "ar-XA-Wavenet-A"
    engine: "google"
    sample_rate: 24000

stt:
  hi:
    language_code: "hi-IN"
    engine: "google"
  mr:
    language_code: "mr-IN"
    engine: "google"
  en:
    language_code: "en-US"
    engine: "google"
  fr:
    language_code: "fr-FR"
    engine: "google"
  ar:
    language_code: "ar-SA"
    engine: "google"

# ─── Inactivity / Silence Nudge Configuration ───
inactivity_defaults:
  enabled: true
  default_timeout_seconds: 5.0
  max_nudges_per_node: 2
  decay_multiplier: 1.4

# ─── System Voice Feedback Messages ───
system_voice_messages:
  hi:
    processing: "आपका उत्तर प्रोसेस हो रहा है। कृपया प्रतीक्षा करें।"
    success_template: "धन्यवाद।"
    fallback_nudges:
      - "क्या आप मेरी आवाज़ सुन पा रहे हैं? कृपया जवाब दीजिए।"
      - "कृपया बताइए, ताकि हम आगे बढ़ सकें।"
  mr:
    processing: "तुमचे उत्तर प्रोसेस होत आहे. कृपया प्रतीक्षा करा."
    success_template: "धन्यवाद."
    fallback_nudges:
      - "तुम्हाला माझा आवाज ऐकू येत आहे का? कृपया उत्तर द्या."
      - "कृपया सांगा, जेणेकरून आपण पुढे जाऊ शकू."
  en:
    processing: "Processing your response. Please wait."
    success_template: "Thank you."
    fallback_nudges:
      - "Can you hear me? Please respond so we can continue."
      - "Please answer the question so we can proceed."
  fr:
    processing: "Traitement en cours. Veuillez patienter."
    success_template: "Merci."
    fallback_nudges:
      - "Vous m'entendez ? Veuillez répondre pour que nous puissions continuer."
      - "Merci de répondre afin que nous puissions poursuivre."
  ar:
    processing: "جاري المعالجة، يرجى الانتظار."
    success_template: "شكراً لك."
    fallback_nudges:
      - "هل تسمعني بوضوح؟ يرجى الرد حتى نتمكن من المتابعة."
      - "يرجى الإجابة لنتمكن من المتابعة."

# ─── Interview Graph Definition ───
interview_graph:
  start_node_id: START
  nodes:
    START:
      type: "voice-qa"
      text_template: "माइक्रो लोन सेवा में आपका स्वागत है। मैं, आपके काम में आपको आगे बढ़ाने के लिए जो लोन चाहिए, उसके बारे में बात कर रही हूँ। क्या आप बताने के लिए तैयार हैं?"
      text_template_mr: "मायक्रो लोन सेवेत आपले स्वागत आहे. मी, आपल्या व्यवसायाला पुढे नेण्यासाठी लागणाऱ्या कर्जाबाबत मदत करण्यासाठी इथे आहे. आपण सुरुवात करायला तयार आहात का?"
      text_template_en: "Welcome to the Micro-Loan service. I am here to assist you with the micro-loan required for your business. Are you ready to begin?"
      text_template_fr: "Bienvenue dans le service de micro-crédit. Je suis là pour vous aider avec le micro-crédit nécessaire à votre entreprise. Êtes-vous prêt à commencer ?"
      text_template_ar: "أهلاً بك في خدمة القروض المصغرة. أنا هنا لمساعدتك في الحصول على القرض المناسب لنشاطك التجاري. هل أنت جاهز للبدء؟"
      targets: []
      edges:
        - condition: "always"
          next: "Q_BUSINESS_PURPOSE"

    Q_BUSINESS_PURPOSE:
      type: "voice-qa"
      text_template: "बढ़िया, और आप किस व्यवसाय के लिए लोन चाहते हैं?"
      text_template_mr: "छान, आणि तुम्हाला कोणत्या व्यवसायासाठी मायक्रो लोन हवे आहे?"
      text_template_en: "Great, and for which business would you like the micro-loan?"
      text_template_fr: "Très bien, et pour quelle entreprise souhaitez-vous ce micro-crédit ?"
      text_template_ar: "ممتاز، وما هو النشاط التجاري الذي ترغب في الحصول على القرض المصغر لأجله؟"
      targets: [business_purpose, business_type]
      routing_prompt: "Evaluate if the business is related to livestock or animal farming (such as dairy, milk, cows/buffaloes, goatry/goats, poultry/chickens). Set 'routing_decision' to 'YES' if livestock or animal farming, 'NO' otherwise."
      inactivity_policy:
        timeout_seconds: 3.0
        nudge_guideline: "Ask if they need help describing their business activity."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_HAVE_SHADE"
        - condition: "business_type in ['dairy', 'goatry', 'poultry', 'goatory']"
          next: "Q_HAVE_SHADE"
        - condition: "always"
          next: "Q_IS_MARRIED"

    Q_HAVE_SHADE:
      type: "voice-qa"
      text_template: "क्या पशुओं या पक्षियों के रखने के लिए आपके पास शेड या अहाता उपलब्ध है?"
      text_template_mr: "जनावरांना/पक्ष्यांना ठेवण्यासाठी तुमच्याकडे शेड किंवा जागा उपलब्ध आहे का?"
      text_template_en: "Do you have a shade/shelter available for keeping livestock or poultry?"
      text_template_fr: "Avez-vous un abri ou un enclos disponible pour garder le bétail ou la volaille ?"
      text_template_ar: "هل لديك حظيرة أو مأوى متاح لتربية المواشي أو الدواجن؟"
      targets: [have_shade]
      routing_prompt: "Evaluate if the user has a shade, shed, or shelter available for animals. Set 'routing_decision' to 'YES' if they have a shade, 'NO' if not."
      inactivity_policy:
        timeout_seconds: 3.0
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_SHADE_DETAILS"
        - condition: "have_shade in ['YES', 'HAAN', 'HO', 'हाँ', 'होय', 'Yes', 'yes']"
          next: "Q_SHADE_DETAILS"
        - condition: "always"
          next: "Q_IS_MARRIED"

    Q_SHADE_DETAILS:
      type: "voice-qa"
      text_template: "यह शेड आपकी अपनी जगह पर है या किराए पर लिया गया है, और यह कहाँ स्थित है?"
      text_template_mr: "हा शेड तुमच्या मालकीचा आहे की भाड्याचा आहे, आणि तो कुठे आहे?"
      text_template_en: "Is this shade owned or rented, and where is it located?"
      text_template_fr: "Cet abri est-il situé sur votre propre terrain ou est-il loué, et où se trouve-t-il ?"
      text_template_ar: "هل هذا المأوى في ملكيتك الخاصة أم مستأجر، وأين يقع بالتحديد؟"
      targets: [shade_owned_or_rented, shade_location]
      inactivity_policy:
        timeout_seconds: 3.0
      edges:
        - condition: "always"
          next: "Q_IS_MARRIED"

    Q_IS_MARRIED:
      type: "voice-qa"
      text_template: "ठीक है। क्या आप विवाहित हैं?"
      text_template_mr: "ठीक आहे. आपले लग्न झाले आहे का?"
      text_template_en: "Alright. Are you married?"
      text_template_fr: "D'accord. Êtes-vous marié(e) ?"
      text_template_ar: "حسناً. هل أنت متزوج؟"
      targets: [is_married]
      routing_prompt: "Evaluate if the user is married. Set 'routing_decision' to 'YES' if married, 'NO' if unmarried or single."
      inactivity_policy:
        timeout_seconds: 3.0
      edges:
        - condition: "always"
          next: "Q_STATUS"

    Q_STATUS:
      type: "voice-qa"
      text_template: "आपका काम कैसा चल रहा है?"
      text_template_mr: "तुमचा व्यवसाय कसा चालला आहे?"
      text_template_en: "How is your business going currently?"
      text_template_fr: "Comment se déroule votre activité actuellement ?"
      text_template_ar: "كيف تسير أعمالك ونشاطك التجاري حالياً؟"
      targets: []
      edges:
        - condition: "always"
          next: "Q_MONTHLY_REV"

    Q_MONTHLY_REV:
      type: "voice-qa"
      text_template: "अभी आप महीने में लगभग कितनी बिक्री कर लेते हैं?"
      text_template_mr: "सध्या तुम्ही महिन्यात साधारण किती रुपयांची विक्री करता?"
      text_template_en: "Approximately how much sales or revenue do you generate per month?"
      text_template_fr: "Quel est environ votre chiffre d'affaires ou vos ventes mensuelles ?"
      text_template_ar: "كم تبلغ مبيعاتك أو إيراداتك الشهرية تقريباً؟"
      targets: [monthly_revenue]
      edges:
        - condition: "always"
          next: "Q_MONTHLY_PROFIT"

    Q_MONTHLY_PROFIT:
      type: "voice-qa"
      text_template: "काम का सारा खर्चा निकालने के बाद, महीने में कितना पैसा बच जाता है?"
      text_template_mr: "व्यवसायाचा सर्व खर्च वजा करून महिन्यात किती नफा शिल्लक राहतो?"
      text_template_en: "After deducting all business expenses, how much net profit remains per month?"
      text_template_fr: "Après avoir déduit toutes les dépenses professionnelles, quel est votre bénéfice net mensuel ?"
      text_template_ar: "بعد خصم جميع المصاريف التشغيلية، كم يتبقى لك كصافي ربح شهرياً؟"
      targets: [monthly_profit]
      edges:
        - condition: "always"
          next: "Q_LAST_YEAR_REV"

    Q_LAST_YEAR_REV:
      type: "voice-qa"
      text_template: "अच्छा! पहले, जब काम नया था, तब महीने की बिक्री कितनी होती थी? पिछले एक साल में काम कुछ बढ़ा है क्या?"
      text_template_mr: "पूर्वी दरमहा साधारण किती विक्री होत होती? गेल्या एका वर्षात व्यवसाय काही वाढला आहे का?"
      text_template_en: "Earlier, what were your monthly sales? Has the business grown over the past year?"
      text_template_fr: "Auparavant, quel était votre chiffre d'affaires mensuel ? Votre entreprise a-t-elle progressé au cours de la dernière année ?"
      text_template_ar: "في السابق، كم كانت مبيعاتك الشهرية؟ وهل شهد نشاطك التجاري نمواً خلال العام الماضي؟"
      targets: [last_year_monthly_revenue]
      edges:
        - condition: "always"
          next: "Q_PERSONS_INVOLVED"

    Q_PERSONS_INVOLVED:
      type: "voice-qa"
      text_template: "अभी काम पर आपके अलावा और कौन-कौन काम करता है?"
      text_template_mr: "सध्या कामावर तुमच्याव्यतिरिक्त आणखी कोण-कोण काम करते?"
      text_template_en: "Who else works in your business besides you?"
      text_template_fr: "Qui d'autre travaille dans votre entreprise à part vous ?"
      text_template_ar: "من يعمل معك في هذا النشاط التجاري بالإضافة إليك؟"
      targets: [persons_involved]
      routing_prompt: "Evaluate if the user works alone or with others. Set 'routing_decision' to 'YES' if they work with others, 'NO' if they work alone."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_PAID_EMPLOYEES"
        - condition: "always"
          next: "Q_INVENTORY"

    Q_PAID_EMPLOYEES:
      type: "voice-qa"
      text_template: "उनमें से घर के लोग हैं या बाहर के लोग भी हैं, जिन्हें पगार देनी पड़ती है?"
      text_template_mr: "त्यांच्यापैकी घराबाहेरचे पगारी कर्मचारी आहेत का?"
      text_template_en: "Are they family members or outside paid employees?"
      text_template_fr: "S'agit-il de membres de votre famille ou d'employés rémunérés ?"
      text_template_ar: "هل هم أفراد من العائلة أم موظفون يتقاضون رواتب؟"
      targets: [number_of_paid_employees]
      routing_prompt: "Evaluate if any workers are paid employees (outsiders). Set 'routing_decision' to 'YES' if they have paid employees, 'NO' if only family members."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_CURRENT_WAGES"
        - condition: "always"
          next: "Q_INVENTORY"

    Q_CURRENT_WAGES:
      type: "voice-qa"
      text_template: "उन लोगों को पगार देने में महीने का कितना खर्च हो जाता है?"
      text_template_mr: "त्या कर्मचाऱ्यांच्या पगारावर महिन्यात किती खर्च होतो?"
      text_template_en: "How much do you spend per month on employee wages?"
      text_template_fr: "Combien dépensez-vous par mois pour les salaires des employés ?"
      text_template_ar: "كم تنفق شهرياً على رواتب الموظفين؟"
      targets: [current_wages]
      edges:
        - condition: "always"
          next: "Q_INVENTORY"

    Q_INVENTORY:
      type: "voice-qa"
      text_template: "अभी दुकान/बिज़नेस में जो माल रखा है, उसकी कुल क़ीमत कितनी होगी?"
      text_template_mr: "सध्या दुकानात किंवा व्यवसायात किती रुपयांचा माल शिल्लक आहे?"
      text_template_en: "What is the total value of stock or inventory currently in your business?"
      text_template_fr: "Quelle est la valeur totale du stock actuel dans votre entreprise ?"
      text_template_ar: "ما هي القيمة الإجمالية للبضائع والمخزون الحالي في منشأتك؟"
      targets: [inventory_amount]
      edges:
        - condition: "always"
          next: "Q_DEBTORS"

    Q_DEBTORS:
      type: "voice-qa"
      text_template: "क्या कोई उधार का पैसा है, जो आपको लोगों से मिलना बाकी है?"
      text_template_mr: "ग्राहकांकडून तुम्हाला काही पैसे येणे बाकी आहे का?"
      text_template_en: "Is there any money owed to you by customers (receivables)?"
      text_template_fr: "Y a-t-il des sommes qui vous sont dues par vos clients ?"
      text_template_ar: "هل هناك أي أموال متبقية لك عند العملاء (ديون للنشاط)؟"
      targets: [debtors_amount]
      edges:
        - condition: "always"
          next: "Q_CREDITORS"

    Q_CREDITORS:
      type: "voice-qa"
      text_template: "और क्या कोई पैसा ऐसा है, जो आपको देना बाकी है? जैसे आपने माल लिया है और पैसा अभी नहीं दिया?"
      text_template_mr: "आणि सप्लायर्सना तुम्हाला काही पैसे देणे बाकी आहे का?"
      text_template_en: "And is there any money you owe to suppliers for stock (payables)?"
      text_template_fr: "Et y a-t-il des sommes que vous devez à vos fournisseurs ?"
      text_template_ar: "وهل هناك أي أموال مستحقة عليك للموردين مقابل البضائع؟"
      targets: [creditors_amount]
      edges:
        - condition: "always"
          next: "Q_PROPOSED_REV"

    Q_PROPOSED_REV:
      type: "voice-qa"
      text_template: "बहुत अच्छा! अब यह जो कर्ज आप लेने वाले हैं, कर्ज मिलने के बाद महीने की बिक्री कितनी हो जाएगी, ऐसा आपको क्या लगता है?"
      text_template_mr: "हे कर्ज मिळाल्यानंतर महिन्याची विक्री किती होईल असे तुम्हाला वाटते?"
      text_template_en: "Great! What do you expect your monthly sales to be after getting this loan?"
      text_template_fr: "Très bien ! Quel chiffre d'affaires mensuel prévoyez-vous après l'obtention de ce prêt ?"
      text_template_ar: "رائع! كم تتوقع أن تصبح مبيعاتك الشهرية بعد الحصول على هذا القرض؟"
      targets: [proposed_monthly_revenue]
      edges:
        - condition: "always"
          next: "Q_PROPOSED_HIRING"

    Q_PROPOSED_HIRING:
      type: "voice-qa"
      text_template: "कर्ज मिलने के बाद, क्या काम के लिए और आदमी रखने पड़ेंगे, या अभी जैसे चल रहा है वैसे चल जाएगा?"
      text_template_mr: "कर्ज मिळाल्यानंतर नवीन लोकांना कामावर ठेवावे लागेल का?"
      text_template_en: "Will you need to hire additional workers after receiving the loan?"
      text_template_fr: "Aurez-vous besoin d'embaucher du personnel supplémentaire après avoir reçu le prêt ?"
      text_template_ar: "هل ستحتاج إلى توظيف عمال إضافيين بعد الحصول على القرض؟"
      targets: [proposed_number_of_people]
      routing_prompt: "Evaluate if the user will hire new people after the loan. Set 'routing_decision' to 'YES' if they will hire new people, 'NO' if not."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_PROPOSED_WAGES"
        - condition: "always"
          next: "Q_NEED_MACHINES"

    Q_PROPOSED_WAGES:
      type: "voice-qa"
      text_template: "उन नए लोगों को पगार देने में महीने का कितना खर्च होगा?"
      text_template_mr: "त्या नवीन कर्मचाऱ्यांच्या पगारावर महिन्यात किती खर्च होईल?"
      text_template_en: "How much will you spend monthly on salaries for those new employees?"
      text_template_fr: "Combien dépenserez-vous par mois pour les salaires de ces nouveaux employés ?"
      text_template_ar: "كم ستكون تكلفة رواتب هؤلاء الموظفين الجدد شهرياً؟"
      targets: [proposed_wages]
      edges:
        - condition: "always"
          next: "Q_NEED_MACHINES"

    Q_NEED_MACHINES:
      type: "voice-qa"
      text_template: "क्या कोई फ्रिज, मशीन या और सामान भी लेना है?"
      text_template_mr: "तुम्हाला कोणती नवीन मशीन, उपकरण किंवा साहित्य खरेदी करायचे आहे का?"
      text_template_en: "Do you need to purchase any new machinery, equipment, or items?"
      text_template_fr: "Avez-vous besoin d'acheter de nouvelles machines ou des équipements ?"
      text_template_ar: "هل تحتاج لشراء أي معدات، آلات، أو أجهزة جديدة؟"
      targets: [needs_machine, machine_name]
      routing_prompt: "Evaluate if the user needs to purchase any new machine or equipment. Set 'routing_decision' to 'YES' if they need a machine/equipment, 'NO' if not."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_MACHINE_DETAILS"
        - condition: "always"
          next: "Q_PREVIOUS_LOAN"

    Q_MACHINE_DETAILS:
      type: "voice-qa"
      text_template: "यह मशीन किस काम आएगी, कहाँ से लेंगे और इसकी कीमत क्या होगी?"
      text_template_mr: "ती मशीन कशासाठी वापरणार आहात, कुठून घेणार आहात आणि तिची किंमत किती असेल?"
      text_template_en: "What is the purpose of this equipment, where will you buy it, and how much will it cost?"
      text_template_fr: "Quel est l'usage de cet équipement, où l'achèterez-vous et quel en sera le coût ?"
      text_template_ar: "ما هو الغرض من هذه المعدات، من أين ستشتريها، وكم ستكون تكلفتها؟"
      targets: [machine_purpose, machine_supplier, machine_cost]
      edges:
        - condition: "always"
          next: "Q_PREVIOUS_LOAN"

    Q_PREVIOUS_LOAN:
      type: "voice-qa"
      text_template: "क्या आपने पहले कभी कर्ज लिया है? कभी किस्त भरने में दिक्कत तो नहीं हुई? मतलब कर्ज लिया और किस्त ना दी या देर से दी हो?"
      text_template_mr: "तुम्ही आधी कधी कर्ज घेतले आहे का? आणि हप्ता भरायला कधी उशीर झाला आहे का?"
      text_template_en: "Have you taken any loan previously, and did you ever face delays in paying installments?"
      text_template_fr: "Avez-vous déjà contracté un prêt auparavant, et avez-vous déjà eu des retards de remboursement ?"
      text_template_ar: "هل حصلت على أي قرض سابقاً، وهل واجهت أي تأخير في سداد الأقساط؟"
      targets: [previous_loan_detail, previous_loan_default_flag, default_reason]
      edges:
        - condition: "always"
          next: "Q_CURRENT_EMI"

    Q_CURRENT_EMI:
      type: "voice-qa"
      text_template: "अभी कोई और कर्ज या किस्त चल रही है क्या? कितनी किस्त है, किस बैंक से है और कितना बचा है?"
      text_template_mr: "सध्या तुमचे कोणते कर्ज किंवा हप्ता (EMI) सुरू आहे का? किती हप्ता आहे आणि कोणत्या बँकेचा आहे?"
      text_template_en: "Do you have any ongoing active loans or monthly EMIs currently?"
      text_template_fr: "Avez-vous actuellement des prêts ou des mensualités en cours ?"
      text_template_ar: "هل لديك أي قروض قائمة حالياً أو أقساط شهرية ملتزم بسدادها؟"
      targets: [current_emi_value, current_emi_lender, current_emi_outstanding]
      edges:
        - condition: "always"
          next: "Q_FAMILY"

    Q_FAMILY:
      type: "voice-qa"
      text_template: "{name} जी, घर में आपके साथ कौन-कौन रहता है?"
      text_template_mr: "{name} जी, कुटुंबात तुमच्यासोबत कोण-कोण राहतात?"
      text_template_en: "{name}, who lives with you in your family?"
      text_template_fr: "{name}, qui vit avec vous dans votre famille ?"
      text_template_ar: "يا سيد {name}، من يعيش معك في المنزل من أفراد عائلتك؟"
      targets: [number_of_family_members, marital_status, number_of_kids]
      edges:
        - condition: "always"
          next: "Q_EDUCATION"

    Q_EDUCATION:
      type: "voice-qa"
      text_template: "आपने कहाँ तक पढ़ाई की है? काम का हिसाब खुद कर लेते हैं?"
      text_template_mr: "तुमचे शिक्षण किती झाले आहे? व्यवसायाचा हिशोब स्वतः करू शकता का?"
      text_template_en: "What is your educational background? Do you handle business accounting yourself?"
      text_template_fr: "Quel est votre niveau d'études ? Gérez-vous vous-même la comptabilité de votre entreprise ?"
      text_template_ar: "ما هو مستواك التعليمي؟ وهل تقوم بإدارة الحسابات المالية لنشاطك بنفسك؟"
      targets: [education_level]
      edges:
        - condition: "always"
          next: "Q_COBORROWER"

    Q_COBORROWER:
      type: "voice-qa"
      text_template: "यह काम आप खुद चलाते हैं, या घर का कोई और भी देखता है?"
      text_template_mr: "हा व्यवसाय तुम्ही स्वतः चालवता, की घरातील आणखी कोणी मदत करते?"
      text_template_en: "Do you manage this business independently, or does a co-borrower assist you?"
      text_template_fr: "Gérez-vous cette entreprise de manière indépendante ou un co-emprunteur vous aide-t-il ?"
      text_template_ar: "هل تدير هذا العمل بمفردك أم يساعدك شريك أو ممتلك آخر في القرض؟"
      targets: [co_borrower]
      edges: []

