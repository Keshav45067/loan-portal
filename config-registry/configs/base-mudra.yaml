# ================================================================
# Base Mudra Loan Scheme Configuration (Reference Template)
# ================================================================

scheme_id: base-mudra
display_name: "Base Mudra Loan Configuration"
languages: [hi, en]

# ─── TTS/STT Configuration ───
tts:
  hi:
    voice_name: "hi-IN-Neural2-A"
    engine: "google"
    sample_rate: 24000
  en:
    voice_name: "en-US-Neural2-F"
    engine: "google"
    sample_rate: 24000

stt:
  hi:
    engine: "google"
    language_code: "hi-IN"
  en:
    engine: "google"
    language_code: "en-US"

# ─── Inactivity / Silence Nudge Configuration ───
inactivity_defaults:
  enabled: true
  default_timeout_seconds: 3.0
  max_nudges_per_node: 2
  decay_multiplier: 1.4

# ─── Base Interview Graph ───
interview_graph:
  start_node_id: "START"
  nodes:
    DOC_SELFIE:
      type: "capture"
      document_id: "selfie"
      text_template: "कृपया अपनी एक सेल्फी लें।"
      edges:
        - condition: "always"
          next: "DOC_AADHAAR_FRONT"

    DOC_AADHAAR_FRONT:
      type: "capture"
      document_id: "aadhaar_front"
      text_template: "कृपया अपने आधार कार्ड के आगे वाले हिस्से की फोटो लें।"
      edges:
        - condition: "always"
          next: "DOC_AADHAAR_BACK"

    DOC_AADHAAR_BACK:
      type: "capture"
      document_id: "aadhaar_back"
      text_template: "कृपया अपने आधार कार्ड के पीछे वाले हिस्से की फोटो लें।"
      edges:
        - condition: "always"
          next: "Q_NAME_CONFIRMATION"

    Q_NAME_CONFIRMATION:
      type: "voice-qa"
      text_template: "कृपया बताएं, क्या मेरी बात {applicant_name} से हो रही है?"
      targets: [name_confirmation]
      edges:
        - condition: "always"
          next: "Q_BUSINESS_PURPOSE"

    Q_BUSINESS_PURPOSE:
      type: "voice-qa"
      text_template: "बढ़िया, और आप किस व्यवसाय के लिए मुद्रा लोन चाहते हैं?"
      targets: [business_purpose]
      inactivity_policy:
        timeout_seconds: 3.0
        nudge_guideline: "Ask if they need help describing their business activity."
      edges:
        - condition: "always"
          next: "Q_IS_MARRIED"

    Q_IS_MARRIED:
      type: "voice-qa"
      text_template: "ठीक है। क्या आप विवाहित हैं?"
      targets: [is_married]
      inactivity_policy:
        timeout_seconds: 3.0
      edges:
        - condition: "always"
          next: "DOC_PAN"

    DOC_PAN:
      type: "capture"
      document_id: "pan"
      text_template: "कृपया अपने पैन कार्ड की फोटो लें।"
      edges:
        - condition: "is_married == 'Yes'"
          next: "DOC_SPOUSE_PAN"
        - condition: "always"
          next: "DOC_UDYAM"

    DOC_SPOUSE_PAN:
      type: "capture"
      document_id: "spouse_pan"
      text_template: "कृपया अपने पति या पत्नी के पैन कार्ड की फोटो लें।"
      edges:
        - condition: "always"
          next: "DOC_UDYAM"

    DOC_UDYAM:
      type: "capture"
      document_id: "udyam"
      text_template: "कृपया अपने उद्यम प्रमाणपत्र की फोटो लें।"
      edges:
        - condition: "always"
          next: "DOC_VOTER_FRONT"

    DOC_VOTER_FRONT:
      type: "capture"
      document_id: "voter_front"
      text_template: "कृपया अपने वोटर आईडी कार्ड के आगे वाले हिस्से की फोटो लें।"
      edges:
        - condition: "always"
          next: "DOC_VOTER_BACK"

    DOC_VOTER_BACK:
      type: "capture"
      document_id: "voter_back"
      text_template: "कृपया अपने वोटर आईडी कार्ड के पीछे वाले हिस्से की फोटो लें।"
      edges:
        - condition: "always"
          next: "PROMPT_MANUAL_FILLING"

    PROMPT_MANUAL_FILLING:
      type: "manual_filling_prompt"
      text_template: "वोटर आईडी कार्ड की पुष्टि हो गई है। क्या आप बाकी की जानकारी खुद फॉर्म में भरना चाहते हैं, या मेरे साथ बोलकर आगे बढ़ना चाहते हैं?"
      targets: []
      edges:
        - condition: "always"
          next: "Q_STATUS"

    START:
      type: "voice-qa"
      text_template: "माइक्रो लोन सेवा में आपका स्वागत है। मैं, आपके काम में आपको आगे बढ़ाने के लिए जो लोन चाहिए, उसके बारे में बात कर रही हूँ। क्या आप बताने के लिए तैयार हैं?"
      targets: []
      edges:
        - condition: "always"
          next: "DOC_SELFIE"

    Q_STATUS:
      type: "voice-qa"
      text_template: "आपका काम कैसा चल रहा है?"
      targets: []
      edges:
        - condition: "always"
          next: "Q_MONTHLY_REV"

    Q_MONTHLY_REV:
      type: "voice-qa"
      text_template: "अभी आप महीने में लगभग कितनी बिक्री कर लेते हैं?"
      targets: [monthly_revenue]
      edges:
        - condition: "always"
          next: "Q_MONTHLY_PROFIT"

    Q_MONTHLY_PROFIT:
      type: "voice-qa"
      text_template: "काम का सारा खर्चा निकालने के बाद, महीने में कितना पैसा बच जाता है?"
      targets: [monthly_profit]
      edges:
        - condition: "always"
          next: "Q_LAST_YEAR_REV"

    Q_LAST_YEAR_REV:
      type: "voice-qa"
      text_template: "अच्छा! पहले, जब काम नया था, तब महीने की बिक्री कितनी होती थी? पिछले एक साल में काम कुछ बढ़ा है क्या?"
      targets: [last_year_monthly_revenue]
      edges:
        - condition: "always"
          next: "Q_PERSONS_INVOLVED"

    Q_PERSONS_INVOLVED:
      type: "voice-qa"
      text_template: "अभी काम पर आपके अलावा और कौन-कौन काम करता है?"
      targets: [persons_involved]
      routing_prompt: "Evaluate if the user works alone or with others. Set 'routing_decision' to 'YES' if they work with others, 'NO' if they work alone."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_PAID_EMPLOYEES"
        - condition: "always"
          next: "Q_INVENTORY"

    Q_PAID_EMPLOYEES:
      type: "voice-qa"
      text_template: "उनमें से घर के लोग हैं या बाहर के लोग भी हैं, जिन्हें पगार देनी पड़ती है?"
      targets: [number_of_paid_employees]
      routing_prompt: "Evaluate if any workers are paid employees (outsiders). Set 'routing_decision' to 'YES' if they have paid employees, 'NO' if only family members."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_CURRENT_WAGES"
        - condition: "always"
          next: "Q_INVENTORY"

    Q_CURRENT_WAGES:
      type: "voice-qa"
      text_template: "उन लोगों को पगार देने में महीने का कितना खर्च हो जाता है?"
      targets: [current_wages]
      edges:
        - condition: "always"
          next: "Q_INVENTORY"

    Q_INVENTORY:
      type: "voice-qa"
      text_template: "अभी दुकान/बिज़नेस में जो माल रखा है, उसकी कुल क़ीमत कितनी होगी?"
      targets: [inventory_amount]
      edges:
        - condition: "always"
          next: "Q_DEBTORS"

    Q_DEBTORS:
      type: "voice-qa"
      text_template: "क्या कोई उधार का पैसा है, जो आपको लोगों से मिलना बाकी है?"
      targets: [debtors_amount]
      edges:
        - condition: "always"
          next: "Q_CREDITORS"

    Q_CREDITORS:
      type: "voice-qa"
      text_template: "और क्या कोई पैसा ऐसा है, जो आपको देना बाकी है? जैसे आपने माल लिया है और पैसा अभी नहीं दिया?"
      targets: [creditors_amount]
      edges:
        - condition: "always"
          next: "Q_PROPOSED_REV"

    Q_PROPOSED_REV:
      type: "voice-qa"
      text_template: "बहुत अच्छा! अब यह जो कर्ज आप लेने वाले हैं, कर्ज मिलने के बाद महीने की बिक्री कितनी हो जाएगी, ऐसा आपको क्या लगता है?"
      targets: [proposed_monthly_revenue]
      edges:
        - condition: "always"
          next: "Q_PROPOSED_HIRING"

    Q_PROPOSED_HIRING:
      type: "voice-qa"
      text_template: "कर्ज मिलने के बाद, क्या काम के लिए और आदमी रखने पड़ेंगे, या अभी जैसे चल रहा है वैसे चल जाएगा?"
      targets: [proposed_number_of_people]
      routing_prompt: "Evaluate if the user will hire new people after the loan. Set 'routing_decision' to 'YES' if they will hire new people, 'NO' if not."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_PROPOSED_WAGES"
        - condition: "always"
          next: "Q_NEED_MACHINES"

    Q_PROPOSED_WAGES:
      type: "voice-qa"
      text_template: "उन नए लोगों को पगार देने में महीने का कितना खर्च होगा?"
      targets: [proposed_wages]
      edges:
        - condition: "always"
          next: "Q_NEED_MACHINES"

    Q_NEED_MACHINES:
      type: "voice-qa"
      text_template: "क्या कोई फ्रिज, मशीन या और सामान भी लेना है?"
      targets: [needs_machine, machine_name]
      routing_prompt: "Evaluate if the user needs to purchase any new machine or equipment. Set 'routing_decision' to 'YES' if they need a machine/equipment, 'NO' if not."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_MACHINE_DETAILS"
        - condition: "always"
          next: "Q_PREVIOUS_LOAN"

    Q_MACHINE_DETAILS:
      type: "voice-qa"
      text_template: "यह मशीन किस काम आएगी, कहाँ से लेंगे और इसकी कीमत क्या होगी?"
      targets: [machine_purpose, machine_supplier, machine_cost]
      edges:
        - condition: "always"
          next: "Q_PREVIOUS_LOAN"

    Q_PREVIOUS_LOAN:
      type: "voice-qa"
      text_template: "क्या आपने पहले कभी कर्ज लिया है? कभी किस्त भरने में दिक्कत तो नहीं हुई? मतलब कर्ज लिया और किस्त ना दी या देर से दी हो?"
      targets: [previous_loan_detail, previous_loan_default_flag, default_reason]
      edges:
        - condition: "always"
          next: "Q_CURRENT_EMI"

    Q_CURRENT_EMI:
      type: "voice-qa"
      text_template: "अभी कोई और कर्ज या किस्त चल रही है क्या? कितनी किस्त है, किस बैंक से है और कितना बचा है?"
      targets: [current_emi_value, current_emi_lender, current_emi_outstanding]
      edges:
        - condition: "always"
          next: "Q_FAMILY"

    Q_FAMILY:
      type: "voice-qa"
      text_template: "{name} जी, घर में आपके साथ कौन-कौन रहता है?"
      targets: [number_of_family_members, marital_status, number_of_kids]
      edges:
        - condition: "always"
          next: "Q_EDUCATION"

    Q_EDUCATION:
      type: "voice-qa"
      text_template: "आपने कहाँ तक पढ़ाई की है? काम का हिसाब खुद कर लेते हैं?"
      targets: [education_level]
      edges:
        - condition: "always"
          next: "Q_COBORROWER"

    Q_COBORROWER:
      type: "voice-qa"
      text_template: "यह काम आप खुद चलाते हैं, या घर का कोई और भी देखता है?"
      targets: [co_borrower]
      edges:
        - condition: "always"
          next: "DOC_WORKPLACE_VIDEO"



    DOC_WORKPLACE_VIDEO:
      type: "video_capture"
      document_id: "workplace_video"
      text_template: "कृपया अपने कार्यस्थल का 30 सेकंड का वीडियो बनाएं।"
      geo_tagged: true
      max_duration_seconds: 30
      instructions:
        - offset_seconds: 0
          text: "कृपया कैमरे को चालू करें और अपनी दुकान के चारों ओर घुमाकर अपना वर्कप्लेस दिखाएं।"
        - offset_seconds: 10
          text: "अब दुकान के मुख्य माल या इन्वेंटरी वाले हिस्से को करीब से दिखाएं।"
        - offset_seconds: 20
          text: "धन्यवाद। अब वीडियो रिकॉर्डिंग समाप्त कर सकते हैं।"
      edges: []

# ─── Context Map (for LLM prompt optimization) ───
context_map:
  START: []
  Q_NAME_CONFIRMATION: []
  Q_BUSINESS_PURPOSE: []
  Q_IS_MARRIED: []
  Q_STATUS: []
  Q_MONTHLY_REV: []
  Q_MONTHLY_PROFIT: [Q_MONTHLY_REV]
  Q_LAST_YEAR_REV: [Q_MONTHLY_REV]
  Q_PERSONS_INVOLVED: []
  Q_PAID_EMPLOYEES: [Q_PERSONS_INVOLVED]
  Q_CURRENT_WAGES: [Q_PAID_EMPLOYEES]
  Q_INVENTORY: []
  Q_DEBTORS: []
  Q_CREDITORS: []
  Q_PROPOSED_REV: [Q_MONTHLY_REV]
  Q_PROPOSED_HIRING: [Q_PERSONS_INVOLVED]
  Q_PROPOSED_WAGES: [Q_PROPOSED_HIRING]
  Q_NEED_MACHINES: []
  Q_MACHINE_DETAILS: [Q_NEED_MACHINES]
  Q_PREVIOUS_LOAN: []
  Q_CURRENT_EMI: []
  Q_FAMILY: []
  Q_EDUCATION: []
  Q_COBORROWER: [Q_FAMILY, Q_PERSONS_INVOLVED]

# ─── Field Extraction Instructions ───
field_instructions:
  name_confirmation: "INFER as 'Yes' or 'No' or correct name if provided."
  business_purpose: "INFER the business name or type of business activity in English."
  is_married: "INFER as 'Yes' or 'No' based on marital status."
  monthly_revenue: "Extract as integer in rupees per month. NO commas, NO decimal. If user says 'lakh', multiply by 100000. If user says 'hazar' or 'thousand', multiply by 1000."
  monthly_profit: "Extract as integer in rupees per month. NO commas, NO decimal. Must be less than monthly_revenue."
  last_year_monthly_revenue: "Extract as integer in rupees per month from previous year. NO commas, NO decimal."
  persons_involved: "Extract as integer. Total number of people working including the owner. If user says 'akele' or 'khud', value is 1."
  number_of_paid_employees: "Extract as integer. Number of employees who receive salary (not family members). If user says 'koi nahi' or 'ghar ke log', value is 0."
  current_wages: "Extract as integer in rupees per month. NO commas, NO decimal. Total monthly wages paid to all employees. If no paid employees, value is 0."
  inventory_amount: "Extract as integer in rupees. NO commas, NO decimal. Total value of stock/inventory currently held."
  debtors_amount: "Extract as integer in rupees. NO commas, NO decimal. Money owed TO the business by customers (receivables). If 'koi nahi', value is 0."
  creditors_amount: "Extract as integer in rupees. NO commas, NO decimal. Money owed BY the business to suppliers (payables). If 'koi nahi', value is 0."
  proposed_monthly_revenue: "Extract as integer in rupees per month. NO commas, NO decimal. Expected revenue AFTER getting loan."
  proposed_number_of_people: "Extract as integer. ADDITIONAL people to be hired after loan (not total). If 'aur kisi ki zarurat nahi', value is 0."
  proposed_wages: "Extract as integer in rupees per month. NO commas, NO decimal. ADDITIONAL wages for new employees after loan. If no new hiring, value is 0."
  needs_machine: "INFER as 'Yes' or 'No'. Whether the user needs to purchase any new machine, equipment, or items."
  machine_name: "INFER the machine/equipment name in ENGLISH. Examples: 'fridge lena hai' -> 'Refrigerator'. If no machine needed, value is 'None'."
  machine_purpose: "INFER the purpose in ENGLISH. Be precise and concise."
  machine_supplier: "INFER the supplier name in ENGLISH. If 'local dukaan se' -> 'Local Market'."
  machine_cost: "Extract as integer in rupees. NO commas, NO decimal. Cost of the machine. If no machine, value is 0."
  previous_loan_detail: "INFER previous loan details in ENGLISH. If none, 'None'."
  previous_loan_default_flag: "INFER if they defaulted or had late payments as 'Yes' or 'No'."
  default_reason: "INFER the reason for default in ENGLISH."
  current_emi_value: "Extract active monthly EMIs amount as integer."
  current_emi_lender: "INFER current lender name in ENGLISH."
  current_emi_outstanding: "Extract outstanding loan amount as integer."
  number_of_family_members: "INFER count as integer."
  marital_status: "INFER as Married, Unmarried, Widow, or Widower."
  number_of_kids: "INFER count as integer."
  education_level: "INFER as No Formal Education, 5th, 8th, 10th, 12th, Graduate, or Post Graduate."
  co_borrower: "INFER as 'Yes' or 'No'."

# ─── Financial Rules ───
financial_rules:
  inventory_multiplier:
    min: 3
    max: 4
  profit_margin:
    min: 0.40
    max: 0.60
  working_cycle_months:
    grocery: 1
    poultry: 2
    goatry: 8
    dairy: 6
    default: 2
  max_loan_amount: 1000000
  promoter_contribution_pct: 0.25
  term_loan_pct: 0.90

# ─── Document Requirements ───
documents_required:
  - type: selfie
    required: true
  - type: aadhaar_front
    required: true
  - type: aadhaar_back
    required: true
  - type: pan
    required: true
  - type: spouse_pan
    required: false
  - type: voter_front
    required: false
  - type: udyam
    required: true
  - type: bank_statement
    required: true
    max_pages: 6
  - type: workplace_video
    required: true

# ─── DB Column Mapping ───
db_mapping:
  full_name: applicant_name
  date_of_birth: date_of_birth
  monthly_revenue: monthly_revenue
  monthly_profit: monthly_profit
  last_year_monthly_revenue: last_year_monthly_revenue
  persons_involved: persons_involved
  number_of_paid_employees: number_of_paid_employees
  current_wages: current_wages
  inventory_amount: inventory_amount
  debtors_amount: debtors_amount
  creditors_amount: creditors_amount
  proposed_monthly_revenue: proposed_monthly_revenue
  proposed_number_of_people: proposed_number_of_people
  proposed_wages: proposed_wages
  needs_machine: needs_machine
  machine_name: machine_name
  machine_purpose: machine_purpose
  education_level: education_level
  co_borrower: co_borrower
  previous_loan_detail: existing_loan
  previous_loan_default_flag: previous_loan_default
  default_reason: default_reason
  current_emi_value: existing_loan_emi
  current_emi_lender: existing_loan_lender
  current_emi_outstanding: existing_loan_outstanding
  business_purpose: proposed_business_activity
  is_married: is_married

# ─── Dynamic Post-processing Pipelines ───
post_processing_pipelines:
  credit_worthiness:
    trigger: "on_complete"
    type: "llm_evaluation"
    model: "gemini-2.5-flash"
    input_fields:
      - "applicant_name"
      - "business_type"
      - "monthly_revenue"
      - "monthly_profit"
      - "last_year_monthly_revenue"
      - "persons_involved"
      - "number_of_paid_employees"
      - "current_wages"
      - "inventory_amount"
      - "debtors_amount"
      - "creditors_amount"
      - "proposed_monthly_revenue"
      - "proposed_number_of_people"
      - "proposed_wages"
      - "needs_machine"
      - "machine_name"
      - "machine_purpose"
      - "machine_supplier"
      - "machine_cost"
      - "number_of_family_members"
      - "marital_status"
      - "number_of_kids"
      - "education_level"
      - "co_borrower"
      - "experience_in_line_of_activity"
      - "net_sales_present_year"
      - "net_sales_next_year"
      - "net_sales_past_year_1"
      - "net_sales_past_year_2"
      - "net_profit_present_year"
      - "net_profit_next_year"
      - "net_profit_past_year_1"
      - "net_profit_past_year_2"
      - "inventory"
      - "debtors"
      - "creditors"
      - "promoters_contribution_in_working_capital"
      - "limits"
      - "cash_credit_amount"
      - "term_loan_promoter_contribution"
      - "term_loan_required"
      - "total_loan_required_amount"
    system_instruction: "You are a credit underwriting analyst evaluating Mudra loan applications for rural India. Respond ONLY in valid JSON. Do not add any extra text."
    prompt_template: |
      Assess the borrower's creditworthiness only based on the extracted conversation and financial rules calculation data provided.
      Do NOT assume, infer, or ask any information that is not explicitly present in the data.
      
      EVALUATION RULES (MANDATORY):
      1. Machinery purchase is OPTIONAL.
      2. Evaluate projected or expected sales AFTER the loan.
      3. Identify inconsistencies or contradictions in the borrower's answers (numbers, timelines, intent).
      4. Accept term loan only, working capital only, or combination.
      5. Do NOT penalize the borrower for lack of explanations, missing documentation, or rounded figures.
      
      SCORING GUIDELINES:
      • Score must be between 0 and 10.
      • Use the anchors: 9–10 (consistent, reasonable), 6–8 (minor gaps, fixable), 3–5 (multiple gaps), 0–2 (highly inconsistent).
      
      INPUT DATA:
      {input_data}
      
      OUTPUT FORMAT:
      Respond ONLY in valid JSON.
      
      {{
        "reason": "5 concise bullet-style points highlighting strengths and gaps in English",
        "creditworthiness_score": "X/10"
      }}
    output_mapping:
      creditworthiness_score: "credit_worthiness"
      reason: "credit_reason"
