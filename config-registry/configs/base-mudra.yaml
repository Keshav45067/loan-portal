# ================================================================
# Base Mudra Loan Scheme Configuration (Reference Template)
# ================================================================

scheme_id: base-mudra
display_name: "Base Mudra Loan Configuration"
languages: [hi, en, mr, fr, ar]

# ─── TTS/STT Configuration ───
tts:
  hi:
    voice_name: "hi-IN-Neural2-A"
    engine: "google"
    sample_rate: 24000
  mr:
    voice_name: "mr-IN-Wavenet-A"
    engine: "google"
    sample_rate: 24000
  en:
    voice_name: "en-US-Neural2-F"
    engine: "google"
    sample_rate: 24000
  fr:
    voice_name: "fr-FR-Neural2-A"
    engine: "google"
    sample_rate: 24000
  ar:
    voice_name: "ar-XA-Wavenet-A"
    engine: "google"
    sample_rate: 24000

stt:
  hi:
    engine: "google"
    language_code: "hi-IN"
  mr:
    engine: "google"
    language_code: "mr-IN"
  en:
    engine: "google"
    language_code: "en-US"
  fr:
    engine: "google"
    language_code: "fr-FR"
  ar:
    engine: "google"
    language_code: "ar-XA"

# ─── Inactivity / Silence Nudge Configuration ───
inactivity_defaults:
  enabled: true
  default_timeout_seconds: 3.0
  max_nudges_per_node: 2
  decay_multiplier: 1.4

# ─── System Standard Voice Messages (Configurable in YAML per language) ───
system_voice_messages:
