# ─── Dynamic Post-processing Pipelines ───
post_processing_pipelines:
  business_viability:
    trigger: "on_complete"
    type: "llm_evaluation"
    model: "gemini-2.5-flash"
    input_fields:
      - "monthly_revenue"
      - "monthly_profit"
      - "inventory_amount"
      - "persons_involved"
      - "proposed_monthly_revenue"
      - "date_of_commencement"
      - "existing_business_activity"
      - "proposed_business_activity"
    system_instruction: "Evaluate Mudra business viability. Output JSON only."
    prompt_template: |
      You are a loan officer evaluating a Mudra loan application for a small rural business owner.
      Based on the interview data below, classify whether the business has meaningful ongoing activities.
      
      Data:
      {input_data}
      
      Decide if the business is 'legitimate', 'suspicious', or 'absent'.
      Provide a concise explanation.
    response_schema:
      type: "object"
      properties:
        business_status:
          type: "string"
          enum: ["legitimate", "suspicious", "absent"]
        business_status_explanation:
          type: "string"
    output_mapping:
      business_status: "business_status"
      business_status_explanation: "business_status_explanation"

  financial_viability:
    trigger: "on_complete"
    type: "llm_evaluation"
    model: "gemini-2.5-flash"
    input_fields:
      - "current_loan_exists"
      - "current_loan_count"
      - "current_loan_purposes"
