  - type: aadhaar_front
    required: true
  - type: aadhaar_back
    required: true
  - type: pan
    required: true
  - type: spouse_pan
    required: false
  - type: voter_front
    required: false
  - type: udyam
    required: true
  - type: bank_statement
    required: true
    max_pages: 6
  - type: workplace_video
    required: true

