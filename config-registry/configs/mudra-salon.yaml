  current_emi_lender: current_emi_lender
  current_emi_outstanding: current_emi_outstanding
  current_emi_value: current_emi_value
  current_wages: current_wages
  date_of_birth: date_of_birth
  debtors_amount: debtors_amount
  default_reason: default_reason
  education_level: education_level
  full_name: applicant_name
  inventory_amount: inventory_amount
  last_year_monthly_revenue: last_year_monthly_revenue
  machine_cost: machine_cost
  machine_name: machine_name
  machine_purpose: machine_purpose
  machine_supplier: machine_supplier
  marital_status: marital_status
  monthly_profit: monthly_profit
  monthly_revenue: monthly_revenue
  needs_machine: needs_machine
