display_name: Mudra Loan - Salon
documents_required:
- required: true
  type: selfie
- required: true
  type: aadhaar_front
- required: true
  type: aadhaar_back
- required: true
  type: pan
- required: false
  type: voter_front
- required: true
  type: udyam
- max_pages: 6
  required: true
  type: bank_statement
field_instructions:
  co_borrower: INFER as 'Yes' or 'No' ONLY.
  creditors_amount: Extract as integer in rupees. NO commas, NO decimal. Money owed BY the business to suppliers (payables). If 'koi nahi', value is 0.
  current_emi_lender: INFER the lender name in ENGLISH.
  current_emi_outstanding: Extract as integer in rupees. If no current loan, value is 0.
  current_emi_value: Extract as integer in rupees per month. If no current loan, value is 0.
  current_wages: Extract as integer in rupees per month. NO commas, NO decimal. Total monthly wages paid to all employees. If no paid employees, value is 0.
  debtors_amount: Extract as integer in rupees. NO commas, NO decimal. Money owed TO the business by customers (receivables). If 'koi nahi', value is 0.
  default_reason: INFER the reason in ENGLISH. If no default, value is empty string.
  education_level: 'INFER as ONE of: ''No Formal Education'', ''5th'', ''8th'', ''10th'', ''12th'', ''Graduate'', ''Post Graduate''.'
  existing_business_activity: INFER and summarize the current business activity in ENGLISH.
  inventory_amount: Extract as integer in rupees. NO commas, NO decimal. Total value of stock/inventory currently held.
  last_year_monthly_revenue: Extract as integer in rupees per month from previous year. NO commas, NO decimal.
  machine_cost: Extract as integer in rupees. NO commas, NO decimal. Cost of the machine. If no machine, value is 0.
  machine_name: 'INFER the machine/equipment name in ENGLISH. Examples: ''fridge lena hai'' -> ''Refrigerator''. If no machine needed, value is ''None''.'
  machine_purpose: INFER the purpose in ENGLISH. Be precise and concise.
  machine_supplier: INFER the supplier name in ENGLISH. If 'local dukaan se' -> 'Local Market'.
  main_loan_purpose: INFER and summarize the MAIN purpose of the loan in ENGLISH.
  marital_status: 'INFER as ONE of: ''Married'', ''Unmarried'', ''Widow'', ''Widower''.'
  monthly_profit: Extract as integer in rupees per month. NO commas, NO decimal. Must be less than monthly_revenue.
  monthly_revenue: Extract as integer in rupees per month. NO commas, NO decimal. If user says 'lakh', multiply by 100000. If user says 'hazar' or 'thousand', multiply by 1000.
  needs_machine: INFER as 'Yes' or 'No'. Whether the user needs to purchase any new machine, equipment, or items.
  number_of_family_members: INFER the count as integer. Count everyone living together including applicant.
  number_of_kids: INFER the count as integer. If none, value is 0.
  number_of_paid_employees: Extract as integer. Number of employees who receive salary (not family members). If user says 'koi nahi' or 'ghar ke log', value is 0.
  persons_involved: Extract as integer. Total number of people working including the owner. If user says 'akele' or 'khud', value is 1.
  previous_loan_default_flag: INFER as 'Yes' or 'No' ONLY.
  previous_loan_detail: INFER and summarize loan details in ENGLISH. If no loan, value is 'None'.
  proposed_activity: INFER and summarize the proposed activity/expansion in ENGLISH.
  proposed_monthly_revenue: Extract as integer in rupees per month. NO commas, NO decimal. Expected revenue AFTER getting loan.
  proposed_number_of_people: Extract as integer. ADDITIONAL people to be hired after loan (not total). If 'aur kisi ki zarurat nahi', value is 0.
  proposed_wages: Extract as integer in rupees per month. NO commas, NO decimal. ADDITIONAL wages for new employees after loan. If no new hiring, value is 0.
  repayment_period: INFER the repayment period as integer (1-5 years).
financial_rules:
  inventory_multiplier:
    max: 4
    min: 3
  max_loan_amount: 1000000
  profit_margin:
    max: 0.6
    min: 0.4
  promoter_contribution_pct: 0.25
  term_loan_pct: 0.9
  working_cycle_months:
    dairy: 6
    default: 2
    goatry: 8
    grocery: 1
    poultry: 2
interview_graph:
  nodes:
    DOC_AADHAAR_BACK:
      document_id: aadhaar_back
      edges:
      - condition: always
        next: START
      type: capture
    DOC_AADHAAR_FRONT:
      document_id: aadhaar_front
      edges:
      - condition: always
        next: DOC_AADHAAR_BACK
      type: capture
    DOC_BANK_STATEMENT:
      document_id: bank_statement
      edges: []
      type: capture
    DOC_COMPANY_ID:
      document_id: company_id
      edges:
      - condition: always
        next: Q_STATUS
      type: capture
    DOC_PAN:
      document_id: pan
      edges:
      - condition: always
        next: DOC_BANK_STATEMENT
      type: capture
    DOC_SELFIE:
      document_id: selfie
      edges:
      - condition: always
        next: DOC_AADHAAR_FRONT
      type: capture
    DOC_UDYAM:
      document_id: udyam
      edges:
      - condition: always
        next: Q_STATUS
      type: capture
    Q_BIZ_TYPE:
      edges:
      - condition: routing_decision == 'YES'
        next: DOC_UDYAM
      - condition: routing_decision == 'NO'
        next: DOC_COMPANY_ID
      - condition: always
        next: Q_STATUS
      routing_prompt: Evaluate if the user is doing business or a job/service. Set 'routing_decision' to 'YES' if they are doing business, 'NO' if they are doing a job/service.
      targets:
      - employment_type
      text_template: क्या आप कोई व्यापार करते हैं या किसी कंपनी में नौकरी करते हैं?
      type: voice-qa
    Q_COBORROWER:
      edges:
      - condition: always
        next: DOC_PAN
      targets:
      - co_borrower
      text_template: यह काम आप खुद चलाते हैं, या घर का कोई और भी देखता है?
      type: voice-qa
    Q_CREDITORS:
      edges:
      - condition: always
        next: Q_PROPOSED_REV
      targets:
      - creditors_amount
      text_template: और क्या कोई पैसा ऐसा है, जो आपको देना बाकी है? जैसे आपने माल लिया है और पैसा अभी नहीं दिया?
      type: voice-qa
    Q_CURRENT_EMI:
      edges:
      - condition: always
        next: Q_FAMILY
      targets:
      - current_emi_value
      - current_emi_lender
      - current_emi_outstanding
      text_template: अभी कोई और कर्ज या किस्त चल रही है क्या?
      type: voice-qa
    Q_CURRENT_WAGES:
      edges:
      - condition: always
        next: Q_INVENTORY
      targets:
      - current_wages
      text_template: उन लोगों को पगार देने में महीने का कितना खर्च हो जाता है?
      type: voice-qa
    Q_DEBTORS:
      edges:
      - condition: always
        next: Q_CREDITORS
      targets:
      - debtors_amount
      text_template: क्या कोई उधार का पैसा है, जो आपको लोगों से मिलना बाकी है?
      type: voice-qa
    Q_EDUCATION:
      edges:
      - condition: always
        next: Q_COBORROWER
      targets:
      - education_level
      text_template: आपने कहाँ तक पढ़ाई की है? काम का हिसाब खुद कर लेते हैं, या किसी और से कराते हैं?
      type: voice-qa
    Q_FAMILY:
      edges:
      - condition: always
        next: Q_EDUCATION
      targets:
      - number_of_family_members
      - marital_status
      - number_of_kids
      text_template: '{name} जी, घर में आपके साथ कौन-कौन रहता है?'
      type: voice-qa
    Q_INVENTORY:
      edges:
      - condition: always
        next: Q_DEBTORS
      targets:
      - inventory_amount
      text_template: दुकान में अभी जो कुर्सियाँ, ब्यूटी उपकरण और प्रोडक्ट्स हैं, उनकी कुल कीमत लगभग कितनी होगी?
      type: voice-qa
    Q_LAST_YEAR_REV:
      edges:
      - condition: always
        next: Q_PERSONS_INVOLVED
      targets:
      - last_year_monthly_revenue
      text_template: अच्छा! पहले, जब काम नया था, तब महीने की कमाई कितनी होती थी? पिछले एक साल में काम कुछ बढ़ा है क्या?
      type: voice-qa
    Q_MACHINE_DETAILS:
      edges:
      - condition: always
        next: Q_PRIOR_LOAN
      targets:
      - machine_purpose
      - machine_supplier
      - machine_cost
      text_template: यह मशीन किस काम आएगी, कहाँ से लेंगे और इसकी कीमत क्या होगी?
      type: voice-qa
    Q_MONTHLY_PROFIT:
      edges:
      - condition: always
        next: Q_LAST_YEAR_REV
      targets:
      - monthly_profit
      text_template: किराया, बिजली, सामान और बाकी खर्च निकालने के बाद, महीने में कितना पैसा बच जाता है?
      type: voice-qa
    Q_MONTHLY_REV:
      edges:
      - condition: always
        next: Q_MONTHLY_PROFIT
      targets:
      - monthly_revenue
      text_template: अभी आप महीने में लगभग कितनी कमाई कर लेते हैं?
      type: voice-qa
    Q_NEED_MACHINES:
      edges:
      - condition: routing_decision == 'YES'
        next: Q_MACHINE_DETAILS
      - condition: always
        next: Q_PRIOR_LOAN
      routing_prompt: Evaluate if the user needs to purchase any new machine or equipment. Set 'routing_decision' to 'YES' if they need a machine/equipment, 'NO' if not.
      targets:
      - needs_machine
      - machine_name
      text_template: क्या कोई नई मशीन, चेयर, या उपकरण लेने का प्लान है?
      type: voice-qa
    Q_PAID_EMPLOYEES:
      edges:
      - condition: routing_decision == 'YES'
        next: Q_CURRENT_WAGES
      - condition: always
        next: Q_INVENTORY
      routing_prompt: Evaluate if any workers are paid employees (outsiders). Set 'routing_decision' to 'YES' if they have paid employees, 'NO' if only family members.
      targets:
      - number_of_paid_employees
      text_template: उनमें से घर के लोग हैं या बाहर के लोग भी हैं, जिन्हें पगार देनी पड़ती है?
      type: voice-qa
    Q_PERSONS_INVOLVED:
      edges:
      - condition: routing_decision == 'YES'
        next: Q_PAID_EMPLOYEES
      - condition: always
        next: Q_INVENTORY
      routing_prompt: Evaluate if the user works alone or with others. Set 'routing_decision' to 'YES' if they work with others, 'NO' if they work alone.
      targets:
      - persons_involved
      text_template: अभी काम पर आपके अलावा और कौन-कौन काम करता है?
      type: voice-qa
    Q_PRIOR_LOAN:
      edges:
      - condition: routing_decision == 'YES'
        next: Q_CURRENT_EMI
      - condition: always
        next: Q_FAMILY
      routing_prompt: Evaluate if the user has taken any loan before. Set 'routing_decision' to 'YES' if they have a previous loan, 'NO' if not.
      targets:
      - previous_loan_detail
      - previous_loan_default_flag
      - default_reason
      text_template: क्या आपने पहले कभी कर्ज लिया है? कभी किस्त भरने में दिक्कत तो नहीं हुई? मतलब लोन लिया हो और किश्त ना दी हो या देर से दी हो?
      type: voice-qa
    Q_PROPOSED_HIRING:
      edges:
      - condition: routing_decision == 'YES'
        next: Q_PROPOSED_WAGES
      - condition: always
        next: Q_NEED_MACHINES
      routing_prompt: Evaluate if the user will hire new people after the loan. Set 'routing_decision' to 'YES' if they will hire new people, 'NO' if not.
      targets:
      - proposed_number_of_people
      text_template: कर्ज मिलने के बाद, क्या काम के लिए और आदमी रखने पड़ेंगे, या अभी जैसे चल रहा है वैसे चल जाएगा?
      type: voice-qa
    Q_PROPOSED_REV:
      edges:
      - condition: always
        next: Q_PROPOSED_HIRING
      targets:
      - proposed_monthly_revenue
      text_template: बहुत अच्छा! अब यह जो कर्ज आप लेने वाले हैं, कर्ज मिलने के बाद महीने की कमाई कितनी हो जाएगी, ऐसा आपको क्या लगता है?
      type: voice-qa
    Q_PROPOSED_WAGES:
      edges:
      - condition: always
        next: Q_NEED_MACHINES
      targets:
      - proposed_wages
      text_template: उन नए लोगों को पगार देने में महीने का कितना खर्च होगा?
      type: voice-qa
    Q_STATUS:
      edges:
      - condition: always
        next: Q_MONTHLY_REV
      targets: []
      text_template: अभी सैलून कैसा चल रहा है?
      type: voice-qa
    START:
      edges:
      - condition: always
        next: Q_BIZ_TYPE
      targets: []
      text_template: '{name} जी, स्मार्ट मुद्रा समाधान में आपका स्वागत है। मैं, आपके सैलून के काम में आपको आगे बढ़ाने के लिए जो लोन चाहिए, उसके बारे में बात कर रही हूँ। आपको जो कर्ज चाहिए, उसे जल्दी दिलाने
        के लिए मुझे आपसे थोड़ी जानकारी लेनी है। जैसे यह कर्ज किस काम में लगेगा, पैसा कहाँ खर्च होगा, और उससे कमाई कितनी बढ़ेगी। क्या आप बताने के लिए तैयार हैं?'
      type: voice-qa
  start_node_id: DOC_SELFIE
