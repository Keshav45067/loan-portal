# ─── Field Extraction Instructions ───
field_instructions:
  existing_enterprise: "INFER as boolean (true for existing business, false for new business)."
  is_new_business: "INFER as boolean (true if starting new business, false if existing)."
  land_rental_owned: "INFER strictly as ONE of: 'Owned' or 'Rented'. If applicant owns the land/premises, set 'Owned'. If rented or leased, set 'Rented'."
  building_ownership: "INFER strictly as ONE of: 'Owned' or 'Rented'. If applicant owns the property/building, set 'Owned'. If rented or leased, set 'Rented'."

  has_previous_loan: "INFER as boolean (true if availed previous loan/scheme, false otherwise)."
  previous_loan_scheme: "Extract the name of the previous scheme as string or empty string if none."
  education_qualification: "Extract educational qualification in English (e.g., '10th Pass', '12th Pass', 'Graduate', 'Post Graduate', 'Diploma', 'Illiterate')."
  mother_name: "Extract full name of the mother in clean English."
  is_married: "INFER as boolean (true if married, false if unmarried/single)."
  spouse_phone: "Extract 10-digit mobile number of spouse as string of digits without country code or symbols."
  
  type_of_business: "Extract type of food processing business in English (e.g., 'Atta Chakki (Flour Mill)', 'Pickle Making', 'Masala Manufacturing', 'Dairy Processing', 'Mustard Oil Mill', 'Bakery', 'Papad Making', 'Banana Chips')."
  food_category: "INFER broad food processing category (e.g., 'Grain Processing', 'Spices & Condiments', 'Fruits & Vegetables Processing', 'Dairy Products', 'Edible Oil', 'Bakery & Confectionery')."
  activities_involved: "INFER and summarize key processing activities in English (e.g., 'Grinding wheat into flour, Packaging, Wholesale and retail distribution')."
  nature_of_operations: "INFER as ONE of: 'Automatic', 'Semi Automatic', 'Manual'. If operations are done by hand without machines -> 'Manual'. If machinery is used with manual assistance -> 'Semi Automatic'. If fully automated -> 'Automatic'."
  proposed_product_type: "INFER as ONE of: 'Agriculture Produce', 'Food Products Manufacturing', 'MFP (Minor Forest Produce)'."
  
  total_available_land_sqft: "Extract as integer in square feet without decimals or commas. If given in 'gaj' multiply by 9, 'meter' multiply by 10.76."
  building_type: "INFER as ONE of: 'Flooring or Minor Civil Construction', 'RCC/Asbestos', 'Shed or Storage', 'Tin Shed', 'Others'."
  building_area: "Extract as integer in square feet. Covered built-up area."
  monthly_rent: "Extract as integer in rupees per month. If building is owned, value MUST be 0."
  
  machineries: "Extract as JSON array of objects: [{\"name\": \"machine name in English\", \"count\": integer, \"unit_cost\": cost_in_rupees}]."
  machine_unit_cost: "Extract per-unit machinery cost in rupees."
  machine_quotations: "JSON array of captured quotation records."
  
  products_to_sell: "Extract as JSON array of objects with product names in English: [{\"name\": \"Wheat Flour\"}]."
  product_monthly_units: "Extract monthly production/sales volume in integer units."
  product_rate_per_unit: "Extract selling rate per unit in rupees as integer."
  
  raw_materials_required: "Extract as JSON array of objects with English names: [{\"name\": \"Raw Material Name\"}]. ACCEPT whatever raw materials or input expenses the applicant mentions (e.g. grains, spices, milk, or cattle feed/fodder/grass for livestock/dairy units). If the applicant states they source inputs from their own animals or farms and only purchase feed, or confirms that nothing else is needed or no other ingredients are required, ACCEPT IT AS COMPLETE immediately. DO NOT debate, cross-examine, or challenge the applicant regarding recipe ingredients or starter cultures."
  raw_material_monthly_qty: "Extract monthly required raw material quantity as integer."
  raw_material_rate_per_unit: "Extract purchase rate per unit in rupees as integer."
  
  working_capital_loan_needed: "INFER as 'Yes' or 'No'. If applicant wants or needs working capital loan -> 'Yes', otherwise 'No'."
  
  has_workers: "INFER as 'Yes' or 'No'. If applicant employs or will employ other workers/helpers -> 'Yes', if working alone/solo -> 'No'."
  total_workers: "Extract total number of workers working with the applicant as integer. Must be reasonable (< 10)."
  worker_roles: "Extract text description in English of employee roles (e.g., 'Machine operator, Packaging helper, Delivery person')."
  new_employment_generated: "Extract integer count of new jobs created by the proposed unit."
  num_skilled_workers: "INFER number of skilled workers from roles description as integer."
  num_unskilled_workers: "INFER number of unskilled/helper workers from roles description as integer."
  wages_skilled_per_month: "Extract monthly salary per skilled worker in rupees as integer."
  wages_unskilled_per_month: "Extract monthly salary per unskilled worker in rupees as integer."

# ─── Financial Rules ───
financial_rules:
  scheme_type: "PMFME"
  max_subsidy_percentage: 0.35
  max_subsidy_cap_amount: 1000000
  beneficiary_capex_contribution_min_pct: 0.10
  beneficiary_working_capital_contribution_min_pct: 0.20
  bank_loan_term_pct_max: 0.90
  interest_rate_range: [0.08, 0.12]
  loan_repayment_period_years: [5, 7]
  project_implementation_period_months: [3, 6]

# ─── Document Requirements ───
documents_required:
  - type: selfie
    required: true
  - type: aadhaar_front
    required: true
  - type: aadhaar_back
    required: true
  - type: udyam
    required: true
  - type: pan
    required: true
  - type: spouse_pan
    required: false
  - type: address_proof
    required: true
    subtypes: ["electricity_bill", "ration_card", "property_registration"]
  - type: lease_agreement
    required: false
    multipage: true
    max_pages: 3
  - type: bank_passbook
    required: true
    multipage: true
    max_pages: 3
  - type: machine_quotations
    required: false
  - type: workplace_video
    required: true

