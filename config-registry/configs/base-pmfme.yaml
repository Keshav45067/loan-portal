# ─── Post-processing Pipelines ───
post_processing_pipelines:
  # Pipeline 1: Business Viability Evaluation
  business_viability:
    trigger: "on_complete"
    type: "llm_evaluation"
    model: "gemini-2.5-flash"
    input_fields:
      - "applicant_name"
      - "enterprise_name"
      - "type_of_business"
      - "food_category"
      - "activities_involved"
      - "nature_of_operations"
      - "proposed_product_type"
      - "total_available_land_sqft"
      - "building_type"
      - "building_area"
      - "building_ownership"
      - "monthly_rent"
      - "machineries"
      - "products_to_sell"
      - "raw_materials_required"
      - "working_capital_loan_needed"
      - "total_workers"
      - "worker_roles"
      - "new_employment_generated"
      - "wages_skilled_per_month"
      - "wages_unskilled_per_month"
    system_instruction: "You are a senior credit and technical appraisal officer evaluating PMFME food processing loan viability for rural micro-entrepreneurs. Return ONLY valid JSON."
    prompt_template: |
      {applicant_name} has applied for a PMFME food processing loan for {enterprise_name}.
      
      BUSINESS DETAILS:
      {input_data}
      
      Evaluate the viability of this food processing business on:
      1. Promoter's capability and experience
      2. Product market demand and scalability
      3. Unit economics & margin feasibility
      4. Raw material supply and local availability
      5. Infrastructure and machinery readiness
      
      PMFME is a government scheme to promote micro-entrepreneurs, so evaluate with utmost leniency.
      Tag the business as 'Highly Viable', 'Viable', or 'Not Viable' and provide a detailed 100-word explanation.
      
      OUTPUT FORMAT (JSON only):
      {{
        "viability_tag": "Highly Viable" | "Viable" | "Not Viable",
        "explanation": "detailed 100-word explanation in English",
        "evaluation_details": {{
          "promoter_capability": "brief assessment",
          "product_demand": "brief assessment",
          "unit_economics": "brief assessment",
          "raw_material_supply": "brief assessment",
          "infrastructure_readiness": "brief assessment"
        }}
      }}
    output_mapping:
      viability_tag: "viability_tag"
      explanation: "viability_explanation"
      evaluation_details: "viability_details"

  # Pipeline 2: Financial Parameter Derivation
  financial_derivation:
    trigger: "on_complete"
    type: "llm_derivation"
    model: "gemini-2.5-flash"
    input_fields:
      - "type_of_business"
      - "activities_involved"
      - "nature_of_operations"
      - "total_available_land_sqft"
      - "building_type"
      - "building_area"
      - "building_ownership"
      - "machineries"
      - "products_to_sell"
      - "raw_materials_required"
      - "applicant_district"
      - "applicant_state"
    system_instruction: "You are a financial analyst for PMFME food processing loan applications. Return ONLY valid JSON with numeric values."
    prompt_template: |
      Given the applicant and business data below, generate the realistic derived financial fields for the PMFME portal:
      
      INPUT DATA:
      {input_data}
      
      Return ONLY a JSON object with:
      {{
        "land_value_per_sqft": 800,
        "personal_contribution_capex": 15.0,
        "preliminary_cost": 15000,
        "furniture_fixture_cost": 25000,
        "contingency_cost": 15000,
        "stock_in_process_days": 7,
        "finished_goods_days": 15,
        "receivable_days": 30,
        "repair_maintenance_pct": 2.0,
        "power_fuel_pct": 5.0,
        "other_overhead_pct": 1.0,
        "telephone_pct": 0.5,
        "stationery_pct": 0.5,
        "advertisement_pct": 1.5,
        "misc_expenditure_pct": 1.0,
        "depreciation_building_pct": 5.0,
        "depreciation_machinery_pct": 15.0,
        "loan_repayment_years": "5",
        "project_implementation_months": "3",
        "rate_of_interest": 9.5,
        "building_rate_per_sqft": 800,
        "own_contribution_working_capital": 25.0
      }}
    output_mapping:
      land_value_per_sqft: "land_value_per_sqft"
      personal_contribution_capex: "personal_contribution_capex"
      preliminary_cost: "preliminary_preoperative_cost"
      furniture_fixture_cost: "furniture_and_fixtures"
      contingency_cost: "contingency_miscellaneous"
      stock_in_process_days: "stock_in_process_days"
      finished_goods_days: "finished_goods_days"
      receivable_days: "receivables_days"
      repair_maintenance_pct: "misc_expenditure_repair_maintenance"
      power_fuel_pct: "misc_expenditure_power_fuel"
      other_overhead_pct: "misc_expenditure_overheads"
      telephone_pct: "misc_expenditure_telephone"
      stationery_pct: "misc_expenditure_stationery"
      advertisement_pct: "misc_expenditure_advertisement"
      misc_expenditure_pct: "misc_expenditure_other"
      depreciation_building_pct: "depreciation_building_percent"
      depreciation_machinery_pct: "depreciation_machinery_percent"
      loan_repayment_years: "loan_repayment_period"
      project_implementation_months: "project_implementation_period"
      rate_of_interest: "rate_of_interest"
      own_contribution_working_capital: "own_contribution_working_capital"

# ─── Declarative Derived Fields Calculation Engine ───
derived_fields:
  experience_in_line_of_activity: "years_since(date_of_commencement, default=1)"
  legal_status_of_business: "legal_status_of_business or 'Proprietary'"
  type_of_property: "if_truthy(building_ownership == 'Owned' or land_rental_owned == 'Owned', 'Owned', 'Rented')"

  # Financial parameter derivations
  personal_contribution_capex: "personal_contribution_capex or 10.0"
  land_value_per_sqft: "land_value_per_sqft or 800"
  building_rate_per_sqft: "building_rate_per_sqft or 800"
  preliminary_preoperative_cost: "preliminary_preoperative_cost or preliminary_cost or 15000"
  furniture_and_fixtures: "furniture_and_fixtures or furniture_fixture_cost or 25000"
  contingency_miscellaneous: "contingency_miscellaneous or contingency_cost or 15000"
  stock_in_process_days: "stock_in_process_days or 7"
  finished_goods_days: "finished_goods_days or 15"
  receivables_days: "receivables_days or receivable_days or 30"
  misc_expenditure_repair_maintenance: "misc_expenditure_repair_maintenance or repair_maintenance_pct or 2.0"
  misc_expenditure_power_fuel: "misc_expenditure_power_fuel or power_fuel_pct or 5.0"
  misc_expenditure_overheads: "misc_expenditure_overheads or other_overhead_pct or 1.0"
  misc_expenditure_telephone: "misc_expenditure_telephone or telephone_pct or 0.5"
  misc_expenditure_stationery: "misc_expenditure_stationery or stationery_pct or 0.5"
  misc_expenditure_advertisement: "misc_expenditure_advertisement or advertisement_pct or 1.5"
  misc_expenditure_other: "misc_expenditure_other or misc_expenditure_pct or 1.0"
  depreciation_building_percent: "depreciation_building_percent or depreciation_building_pct or 5.0"
  depreciation_machinery_percent: "depreciation_machinery_percent or depreciation_machinery_pct or 15.0"
  loan_repayment_period: "loan_repayment_period or loan_repayment_years or '5'"
  project_implementation_period: "project_implementation_period or project_implementation_months or '3'"
  rate_of_interest: "rate_of_interest or 9.5"
  own_contribution_working_capital: "own_contribution_working_capital or 25.0"

