# ================================================================
# Base PMFME (Pradhan Mantri Formalisation of Micro Food Processing Enterprises) Scheme Configuration
# ================================================================

scheme_id: base-pmfme
display_name: "PM Formalisation of Micro Food Processing Enterprises (PMFME) Scheme"
languages: [hi, en, mr, fr, ar]

# ─── TTS/STT Configuration ───
tts:
  hi:
    voice_name: "hi-IN-Neural2-A"
    engine: "google"
    sample_rate: 24000
  mr:
    voice_name: "mr-IN-Wavenet-A"
    engine: "google"
    sample_rate: 24000
  en:
    voice_name: "en-US-Neural2-F"
    engine: "google"
    sample_rate: 24000
  fr:
    voice_name: "fr-FR-Neural2-A"
    engine: "google"
    sample_rate: 24000
  ar:
    voice_name: "ar-XA-Wavenet-A"
    engine: "google"
    sample_rate: 24000

stt:
  hi:
    language_code: "hi-IN"
    engine: "google"
  mr:
    language_code: "mr-IN"
    engine: "google"
  en:
    language_code: "en-US"
    engine: "google"
  fr:
    language_code: "fr-FR"
    engine: "google"
  ar:
    language_code: "ar-XA"
    engine: "google"

# ─── Inactivity / Silence Nudge Configuration ───
inactivity_defaults:
  enabled: true
  default_timeout_seconds: 5.0
  max_nudges_per_node: 2
  decay_multiplier: 1.4

# ─── System Standard Voice Messages ───
system_voice_messages:
  hi:
    processing: "आपका दस्तावेज़ प्रोसेस हो रहा है। कृपया प्रतीक्षा करें।"
    success_template: "आपके {doc_name} से विवरण निकाल लिए गए हैं।"
    error_blur: "फ़ोटो धुंधली या कटी हुई है। कृपया एक स्पष्ट फ़ोटो लें।"
    error_invalid: "यह सही दस्तावेज़ नहीं लग रहा है। कृपया सही दस्तावेज़ की एक स्पष्ट फ़ोटो अपलोड करें।"
    error_default: "सत्यापन विफल रहा। कृपया एक मान्य दस्तावेज़ अपलोड करें।"
    doc_complete: "बधाई हो! आपके दस्तावेज़ सफलतापूर्वक जमा हो गए हैं। अगला कदम है ए आई इंटरव्यू, जिसमें आपसे आपके खाद्य प्रसंस्करण व्यवसाय के बारे में कुछ सवाल पूछे जाएंगे।"
    interview_complete: "बहुत अच्छा! आपका इंटरव्यू पूरा हो गया है। अब बस एक और कदम बाकी है। अगला कदम है वीडियो सत्यापन, जिसमें आपको अपने कार्यस्थल की पुष्टि के लिए एक छोटा वीडियो रिकॉर्ड करना होगा।"
    geo_complete: "बधाई हो! आपका PMFME आवेदन पूरी तरह से सफलतापूर्वक जमा हो गया है। हमारी टीम जल्द ही आपसे संपर्क करेगी।"
    fallback_nudges:
      - "क्या आपको मेरी आवाज आ रही है? मैं आपकी सहायता के लिए यहाँ हूँ।"
      - "कोई जल्दी नहीं है, आप आराम से उत्तर दे सकते हैं।"
    doc_names:
      selfie: "सेल्फी"
      aadhaar_front: "आधार कार्ड का अगला हिस्सा"
      aadhaar_back: "आधार कार्ड का पिछला हिस्सा"
      udyam: "उद्यम प्रमाणपत्र"
      pan: "पैन कार्ड"
      spouse_pan: "पति या पत्नी का पैन कार्ड"
      address_proof: "एड्रेस प्रूफ (बिजली बिल / राशन कार्ड / संपत्ति दस्तावेज)"
      electricity_bill: "बिजली का बिल"
      ration_card: "राशन कार्ड"
      property_registration: "संपत्ति पंजीकरण दस्तावेज"
      lease_agreement: "लीज़ या किराया समझौता"
      bank_passbook: "बैंक पासबुक"
      machine_quotations: "मशीन कोटेशन"
      workplace_video: "कार्यस्थल का वीडियो"
      default: "दस्तावेज़"

  mr:
    processing: "तुमचे कागदपत्र तपासले जात आहे. कृपया थोडी वाट पहा."
    success_template: "तुमच्या {doc_name} मधून माहिती मिळवली गेली आहे."
    error_blur: "फोटो अस्पष्ट किंवा कापलेला आहे. कृपया एक स्पष्ट फोटो घ्या."
    error_invalid: "हे योग्य कागदपत्र दिसत नाही. कृपया योग्य कागदपत्राचा स्पष्ट फोटो अपलोड करा."
    error_default: "पडताळणी अयशस्वी झाली. कृपया वैध कागदपत्र अपलोड करा."
    doc_complete: "अभिनंदन! तुमची कागदपत्रे यशस्वीरित्या सबमिट झाली आहेत. पुढील टप्पा म्हणजे AI मुलाखत आहे."
    interview_complete: "खूप छान! तुमची मुलाखत पूर्ण झाली आहे. आता फक्त व्हिडिओ पडताळणी बाकी आहे."
    geo_complete: "अभिनंदन! तुमचा PMFME अर्ज यशस्वीरीत्या सादर झाला आहे."
    fallback_nudges:
      - "तुम्हाला माझा आवाज येतोय का? मी तुमच्या मदतीसाठी इथे आहे."
      - "काही घाई नाही, तुम्ही सवडीने उत्तर देऊ शकता."
    doc_names:
      selfie: "सेल्फी"
      aadhaar_front: "आधार कार्डची पुढील बाजू"
      aadhaar_back: "आधार कार्डची मागील बाजू"
      udyam: "उद्यम प्रमाणपत्र"
      pan: "पॅन कार्ड"
      spouse_pan: "पती/पत्नीचे पॅन कार्ड"
      address_proof: "पत्याचा पुरावा"
      lease_agreement: "भाडे करार"
      bank_passbook: "बँक पासबुक"
      machine_quotations: "मशीन कोटेशन"
      workplace_video: "कामाच्या जागेचा व्हिडिओ"
      default: "कागदपत्र"

  en:
    processing: "Processing your document. Please wait."
    success_template: "Details extracted from your {doc_name}."
    error_blur: "The photo appears blurry or cropped. Please capture a clearer photo."
    error_invalid: "This does not seem to be the correct document. Please upload a clear photo of the requested document."
    error_default: "Verification failed. Please upload a valid document."
    doc_complete: "Congratulations! Your documents have been successfully submitted. Next step is the AI interview regarding your food processing enterprise."
    interview_complete: "Great job! Your interview is complete. The final step is video verification of your workplace."
    geo_complete: "Congratulations! Your PMFME application has been submitted successfully."
    fallback_nudges:
      - "Can you hear me? I am here to assist you."
      - "Take your time, you can answer at your convenience."
    doc_names:
      selfie: "Selfie"
      aadhaar_front: "Aadhaar Card Front"
      aadhaar_back: "Aadhaar Card Back"
      udyam: "Udyam Certificate"
      pan: "PAN Card"
      spouse_pan: "Spouse PAN Card"
      address_proof: "Address Proof"
      lease_agreement: "Lease/Rent Agreement"
      bank_passbook: "Bank Passbook"
      machine_quotations: "Machinery Quotation"
      workplace_video: "Workplace Video"
      default: "Document"

# ─── Interview Graph Definition ───
interview_graph:
  start_node_id: START
  nodes:
    # ─── Phase 1: Welcome & Document Captures ───
    START:
      type: "voice-qa"
      text_template: "प्रधानमंत्री सूक्ष्म खाद्य उद्योग उन्नयन योजना (PMFME) में आपका स्वागत है। मैं आपके खाद्य प्रसंस्करण उद्यम के लोन आवेदन में आपकी सहायता करूँगी। क्या हम दस्तावेज़ सत्यापन से शुरुआत करें?"
      text_template_en: "Welcome to the PMFME (Food Processing Enterprises) loan service. I will assist you with your application. Shall we start with document verification?"
      text_template_mr: "प्रधानमंत्री सूक्ष्म अन्न प्रक्रिया उद्योग योजना (PMFME) मध्ये आपले स्वागत आहे. आपण कागदपत्र पडताळणीने सुरुवात करूया का?"
      targets: []
      edges:
        - condition: "always"
          next: "DOC_SELFIE"

    DOC_SELFIE:
      type: "capture"
      document_id: "selfie"
      manifest_id: "selfie"
      page_id: "selfie"
      text_template: "कृपया अपनी एक स्पष्ट सेल्फी फोटो लें।"
      text_template_en: "Please take a clear selfie photo of yourself."
      text_template_mr: "कृपया तुमचा एक स्पष्ट सेल्फी फोटो घ्या."
      edges:
        - condition: "always"
          next: "DOC_AADHAAR_FRONT"

    DOC_AADHAAR_FRONT:
      type: "capture"
      document_id: "aadhaar_front"
      manifest_id: "doc_aadhaar_002"
      page_id: "front"
      text_template: "कृपया अपने आधार कार्ड के आगे वाले हिस्से की फोटो लें।"
      text_template_en: "Please capture the front side of your Aadhaar card."
      text_template_mr: "कृपया तुमच्या आधार कार्डच्या पुढील बाजूचा फोटो घ्या."
      edges:
        - condition: "always"
          next: "DOC_AADHAAR_BACK"

    DOC_AADHAAR_BACK:
      type: "capture"
      document_id: "aadhaar_back"
      manifest_id: "doc_aadhaar_002"
      page_id: "back"
      text_template: "अब कृपया आधार कार्ड के पीछे वाले हिस्से की फोटो लें जिसमें आपका पता लिखा हो।"
      text_template_en: "Now please capture the back side of your Aadhaar card showing your address."
      text_template_mr: "आता आधार कार्डच्या मागील बाजूचा पत्ता असलेला फोटो घ्या."
      edges:
        - condition: "always"
          next: "DOC_UDYAM"

    DOC_UDYAM:
      type: "capture"
      document_id: "udyam"
      manifest_id: "doc_udyam_001"
      page_id: "front"
      text_template: "अब कृपया अपने उद्यम पंजीकरण प्रमाणपत्र (Udyam Certificate) की फोटो लें।"
      text_template_en: "Now please capture a photo of your Udyam Registration Certificate."
      text_template_mr: "आता कृपया तुमच्या उद्यम नोंदणी प्रमाणपत्राचा फोटो घ्या."
      edges:
        - condition: "always"
          next: "Q_DOC_QA_EXISTING_BIZ"

    # ─── Document Scanner Q&A Sub-Flow ───
    Q_DOC_QA_EXISTING_BIZ:
      type: "voice-qa"
      text_template: "आपका खाद्य व्यवसाय पहले से चल रहा है या आप बिल्कुल नया व्यवसाय शुरू कर रहे हैं?"
      text_template_en: "Is your food processing business already existing, or are you starting a completely new unit?"
      text_template_mr: "तुमचा अन्न प्रक्रिया व्यवसाय आधीपासून सुरू आहे की तुम्ही नवीन सुरू करत आहात?"
      targets: ["existing_enterprise", "is_new_business"]
      edges:
        - condition: "always"
          next: "Q_DOC_QA_PROPERTY_OWNED"

    Q_DOC_QA_PROPERTY_OWNED:
      type: "voice-qa"
      text_template: "जहाँ आप काम करेंगे या कारखाना लगाएंगे, वह जगह आपकी अपनी है या किराए पर है?"
      text_template_en: "Is the proposed business premises owned by you or rented?"
      text_template_mr: "व्यवसायाची जागा तुमच्या स्वतःच्या मालकीची आहे की भाड्याने घेतलेली आहे?"
      targets: ["land_rental_owned", "building_ownership"]
      edges:
        - condition: "always"
          next: "Q_DOC_QA_OTHER_SCHEME"

    Q_DOC_QA_OTHER_SCHEME:
      type: "voice-qa"
      text_template: "क्या आपने इस व्यवसाय के लिए पहले कभी किसी अन्य सरकारी योजना का लाभ लिया है? अगर हाँ, तो कृपया योजना का नाम बताएं।"
      text_template_en: "Have you previously availed benefits from any other government scheme for this business? If yes, please mention the scheme name."
      text_template_mr: "तुम्ही या व्यवसायासाठी यापूर्वी इतर कोणत्याही सरकारी योजनेचा लाभ घेतला आहे का?"
      targets: ["has_previous_loan", "previous_loan_scheme"]
      edges:
        - condition: "always"
          next: "Q_DOC_QA_EDUCATION"

    Q_DOC_QA_EDUCATION:
      type: "voice-qa"
      text_template: "आपकी पढ़ाई कहाँ तक हुई है? मतलब आपकी शैक्षणिक योग्यता क्या है?"
      text_template_en: "What is your highest educational qualification?"
      text_template_mr: "तुमचे शिक्षण कुठपर्यंत झाले आहे?"
      targets: ["education_qualification"]
      edges:
        - condition: "always"
          next: "Q_DOC_QA_MOTHER_NAME"

    Q_DOC_QA_MOTHER_NAME:
      type: "voice-qa"
      text_template: "आपकी माता जी का पूरा नाम क्या है?"
      text_template_en: "What is your mother's full name?"
      text_template_mr: "तुमच्या आईचे पूर्ण नाव काय आहे?"
      targets: ["mother_name"]
      edges:
        - condition: "always"
          next: "Q_DOC_QA_MARRIED"

    Q_DOC_QA_MARRIED:
      type: "voice-qa"
      text_template: "क्या आप विवाहित हैं?"
      text_template_en: "Are you married?"
      text_template_mr: "तुमचे लग्न झाले आहे का?"
      targets: ["is_married"]
      routing_prompt: "Evaluate if user is married. Return 'YES' if married, 'NO' if unmarried or single."
      edges:
        - condition: "routing_decision == 'YES'"
          next: "Q_DOC_QA_SPOUSE_PHONE"
        - condition: "always"
          next: "DOC_PAN"

    Q_DOC_QA_SPOUSE_PHONE:
      type: "voice-qa"
      text_template: "कृपया अपने पति या पत्नी का 10 अंकों का मोबाइल नंबर बताइए।"
      text_template_en: "Please provide your spouse's 10-digit mobile number."
      text_template_mr: "कृपया तुमच्या पती/पत्नीचा १० अंकी मोबाईल नंबर सांगा."
      targets: ["spouse_phone"]
      edges:
        - condition: "always"
          next: "DOC_PAN"

    DOC_PAN:
      type: "capture"
      document_id: "pan"
      manifest_id: "doc_pan_001"
      page_id: "front"
      text_template: "कृपया अपने पैन कार्ड की साफ फोटो लें।"
      text_template_en: "Please capture a clear photo of your PAN card."
      text_template_mr: "कृपया तुमच्या पॅन कार्डचा फोटो घ्या."
      edges:
        - condition: "is_married == true"
          next: "DOC_SPOUSE_PAN"
        - condition: "always"
          next: "Q_ADDRESS_PROOF_TYPE"

    DOC_SPOUSE_PAN:
      type: "capture"
      document_id: "spouse_pan"
      manifest_id: "doc_pan_001"
      page_id: "front"
      text_template: "कृपया अपने पति या पत्नी के पैन कार्ड की साफ फोटो लें।"
      text_template_en: "Please capture a photo of your spouse's PAN card."
      text_template_mr: "कृपया तुमच्या पती/पत्नीच्या पॅन कार्डचा फोटो घ्या."
      edges:
        - condition: "always"
          next: "Q_ADDRESS_PROOF_TYPE"

    Q_ADDRESS_PROOF_TYPE:
      type: "voice-qa"
      text_template: "पते के प्रमाण (Address Proof) के लिए आप कौन सा दस्तावेज़ देना चाहेंगे—वोटर आईडी, राशन कार्ड, बिजली का बिल, या ड्राइविंग लाइसेंस?"
      text_template_mr: "पत्याच्या पुराव्यासाठी तुम्ही कोणते दस्तऐवज देऊ इच्छिता—व्होटर आयडी, रेशन कार्ड, वीज बिल, की ड्रायव्हिंग लायसन्स?"
      text_template_en: "Which document would you like to provide as proof of address—Voter ID, Ration Card, Electricity Bill, or Driving License?"
      targets: [address_proof_type]
      routing_prompt: "Identify the user's address proof preference. Set 'routing_decision' to: 'VOTER' if Voter ID/card/EPIC, 'RATION' if Ration Card, 'ELECTRICITY' if Electricity Bill/Bijli Bill, 'DL' if Driving License."
      inactivity_policy:
        timeout_seconds: 3.0
        nudge_guideline: "Ask which address proof document they would like to provide among Voter ID, Ration Card, Electricity Bill, or Driving License."
      edges:
        - condition: "routing_decision == 'VOTER' || address_proof_type in ['voter_id', 'voter', 'epic', 'voter_card', 'वोटर', 'मतदान']"
          next: "DOC_VOTER_FRONT"
        - condition: "routing_decision == 'RATION' || address_proof_type in ['ration_card', 'ration', 'राशन', 'रेशन']"
          next: "DOC_RATION_CARD"
        - condition: "routing_decision == 'ELECTRICITY' || address_proof_type in ['electricity_bill', 'electricity', 'bijli_bill', 'बिजली', 'वीज']"
          next: "DOC_ELECTRICITY_BILL"
        - condition: "routing_decision == 'DL' || address_proof_type in ['driving_license', 'dl', 'license', 'driving', 'लाइसेंस', 'ड्राइविंग']"
          next: "DOC_DRIVING_LICENSE"
        - condition: "always"
          next: "DOC_VOTER_FRONT"

    DOC_VOTER_FRONT:
      type: "capture"
      document_id: "voter_front"
      manifest_id: doc_voter_001
      page_id: front
      text_template: "कृपया अपने वोटर आईडी कार्ड के आगे वाले हिस्से की फोटो लें।"
      text_template_mr: "कृपया आपल्या व्होटर आयडी कार्डच्या समोरील बाजूचा फोटो घ्या."
      text_template_en: "Please take a photo of the front side of your Voter ID card."
      edges:
        - condition: "always"
          next: "DOC_VOTER_BACK"

    DOC_VOTER_BACK:
      type: "capture"
      document_id: "voter_back"
      manifest_id: doc_voter_001
      page_id: back
      text_template: "कृपया अपने वोटर आईडी कार्ड के पीछे वाले हिस्से की फोटो लें।"
      text_template_mr: "कृपया आपल्या व्होटर आयडी कार्डच्या मागच्या बाजूचा फोटो घ्या."
      text_template_en: "Please take a photo of the back side of your Voter ID card."
      edges:
        - condition: "building_ownership == 'Rented'"
          next: "DOC_LEASE_AGREEMENT"
        - condition: "always"
          next: "DOC_BANK_PASSBOOK"

    DOC_RATION_CARD:
      type: "capture"
      document_id: "ration_card"
      manifest_id: doc_ration_001
      page_id: front
      text_template: "कृपया अपने राशन कार्ड के मुख्य पृष्ठ की फोटो लें।"
      text_template_mr: "कृपया आपल्या रेशन कार्डच्या मुख्य पानाचा फोटो घ्या."
      text_template_en: "Please take a photo of the main page of your Ration Card."
      edges:
        - condition: "building_ownership == 'Rented'"
          next: "DOC_LEASE_AGREEMENT"
        - condition: "always"
          next: "DOC_BANK_PASSBOOK"

    DOC_ELECTRICITY_BILL:
      type: "capture"
      document_id: "electricity_bill"
      manifest_id: doc_electricity_001
      page_id: bill
      text_template: "कृपया अपने बिजली बिल की साफ फोटो लें।"
      text_template_mr: "कृपया आपल्या वीज बिलाचा स्पष्ट फोटो घ्या."
      text_template_en: "Please take a clear photo of your Electricity Bill."
      edges:
        - condition: "building_ownership == 'Rented'"
          next: "DOC_LEASE_AGREEMENT"
        - condition: "always"
          next: "DOC_BANK_PASSBOOK"

    DOC_DRIVING_LICENSE:
      type: "capture"
      document_id: "driving_license"
      manifest_id: doc_dl_001
      page_id: front
      text_template: "कृपया अपने ड्राइविंग लाइसेंस की साफ फोटो लें।"
      text_template_mr: "कृपया आपल्या ड्रायव्हिंग लायसन्सचा स्पष्ट फोटो घ्या."
      text_template_en: "Please take a clear photo of your Driving License."
      edges:
        - condition: "building_ownership == 'Rented'"
          next: "DOC_LEASE_AGREEMENT"
        - condition: "always"
          next: "DOC_BANK_PASSBOOK"

    DOC_LEASE_AGREEMENT:
      type: "capture"
      document_id: "lease_agreement"
      manifest_id: "doc_lease_001"
      page_id: "page_1"
      multipage: true
      max_pages: 3
      text_template: "कृपया अपने लीज़ या किराया समझौते के पन्नों की फोटो लें।"
      text_template_en: "Please capture pages of your Lease or Rent Agreement."
      text_template_mr: "कृपया तुमच्या भाडे कराराच्या पानांचे फोटो घ्या."
      edges:
        - condition: "always"
          next: "DOC_BANK_PASSBOOK"

    DOC_BANK_PASSBOOK:
      type: "capture"
      document_id: "bank_passbook"
      manifest_id: "doc_bank_statement_001"
      page_id: "page_1"
      multipage: true
      max_pages: 3
      text_template: "कृपया अपनी बैंक पासबुक के मुख्य पृष्ठ की स्पष्ट फोटो लें।"
      text_template_en: "Please capture a clear photo of your bank passbook's front page showing account number and IFSC code."
      text_template_mr: "कृपया तुमच्या बँक पासबुकच्या पहिल्या पानाचा फोटो घ्या ज्यावर खाते क्रमांक आणि IFSC कोड असेल."
      edges:
        - condition: "always"
          next: "Q_INTERVIEW_INTRO"

    # ─── Phase 2: AI Loan Interview (Business Voice Graph) ───
    Q_INTERVIEW_INTRO:
      type: "voice-qa"
      text_template: "नमस्कार {applicant_name}! दस्तावेज़ देने के लिए आपका धन्यवाद। अब मैं आपसे आपके खाद्य प्रसंस्करण काम-धंधे के बारे में थोड़ी जानकारी लूँगी। क्या हम शुरू करें?"
      text_template_en: "Hello {applicant_name}! Thank you for submitting documents. Now I will take a few details about your food processing business. Shall we begin?"
      text_template_mr: "नमस्कार {applicant_name}! कागदपत्रे दिल्याबद्दल धन्यवाद. आता मी तुमच्या अन्न प्रक्रिया व्यवसायाबद्दल काही माहिती घेईन."
      targets: []
      edges:
        - condition: "always"
          next: "Q_TYPE_OF_BUSINESS"

    Q_TYPE_OF_BUSINESS:
      type: "voice-qa"
      text_template: "सबसे पहले बताइए, आप कौन सा काम या खाद्य प्रसंस्करण उद्योग शुरू करना चाहते हैं?"
      text_template_en: "First of all, what type of food processing or manufacturing business are you operating or proposing to set up?"
      text_template_mr: "सर्वप्रथम सांगा, तुम्ही कोणता अन्न प्रक्रिया व्यवसाय सुरू करू इच्छिता?"
      targets: ["type_of_business", "food_category"]
      edges:
        - condition: "always"
          next: "Q_ACTIVITIES_OPERATIONS"

    Q_ACTIVITIES_OPERATIONS:
      type: "voice-qa"
      text_template: "अच्छा, इस काम में आप क्या-क्या करेंगे, जरा विस्तार से समझाइए? और यह काम मशीनों से होगा या हाथों से?"
      text_template_en: "Could you explain what activities and operations are involved? Is it automatic, semi-automatic, or manual?"
      text_template_mr: "या व्यवसायात तुम्ही कोणती कामे करणार आहात? हे काम पूर्णपणे मशीनने होणार की हाताने?"
      targets: ["activities_involved", "nature_of_operations", "proposed_product_type"]
      edges:
        - condition: "always"
          next: "Q_LAND_AREA"

    Q_LAND_AREA:
      type: "voice-qa"
      text_template: "इस काम के लिए आपके पास कुल कितनी जगह या जमीन उपलब्ध है? कृपया वर्ग फीट (Square Feet) में बताइए।"
      text_template_en: "How much total land or space do you have for this unit? Please specify in square feet."
      text_template_mr: "या कामासाठी तुमच्याकडे एकूण किती जागा किंवा जमीन उपलब्ध आहे? कृपया स्क्वेअर फूटमध्ये सांगा."
      targets: ["total_available_land_sqft"]
      edges:
        - condition: "always"
          next: "Q_BUILDING_STRUCTURE"

    Q_BUILDING_STRUCTURE:
      type: "voice-qa"
      text_template: "और वहाँ आपने क्या बनाया है या निर्माण करेंगे? जैसे टिन शेड, पक्का RCC भवन, स्टोरेज, या साधारण फर्श? और उसका क्षेत्रफल कितना है?"
      text_template_en: "What type of building structure is present or planned (e.g. Tin Shed, RCC, Storage Shed)? What is the covered building area?"
      text_template_mr: "तिथे तुम्ही कशा प्रकारचे बांधकाम केले आहे (टिन शेड, पक्के बांधकाम, गोडाऊन) आणि त्याचे क्षेत्रफळ किती आहे?"
      targets: ["building_type", "building_area"]
      edges:
        - condition: "building_ownership == 'Rented'"
          next: "Q_MONTHLY_RENT"
        - condition: "nature_of_operations == 'Manual'"
          next: "Q_PRODUCTS_TO_SELL"
        - condition: "always"
          next: "Q_MACHINERIES"

    Q_MONTHLY_RENT:
      type: "voice-qa"
      text_template: "किराए की इस जगह के लिए आप हर महीने कितना किराया देते हैं?"
      text_template_en: "How much monthly rent do you pay for this rented premises?"
      text_template_mr: "या भाड्याच्या जागेसाठी तुम्ही दरमहा किती भाडे देता?"
      targets: ["monthly_rent"]
      edges:
        - condition: "nature_of_operations == 'Manual'"
          next: "Q_PRODUCTS_TO_SELL"
        - condition: "always"
          next: "Q_MACHINERIES"

    Q_MACHINERIES:
      type: "voice-qa"
      text_template: "इस काम के लिए आपको कौन-कौन सी मशीनों की ज़रूरत पड़ेगी? कितनी-कितनी मशीनें लेंगे और एक मशीन की कीमत लगभग कितनी होगी?"
      text_template_en: "Which machineries and equipment do you require? How many units and what is the approximate cost per unit?"
      text_template_mr: "या कामासाठी तुम्हाला कोणकोणत्या मशिन्स लागतील? किती मशिन्स घेणार आणि एका मशीनची किंमत अंदाजे किती असेल?"
      targets: ["machineries", "machine_unit_cost"]
      edges:
        - condition: "always"
          next: "Q_MACHINE_QUOTATION_CAPTURE"

    Q_MACHINE_QUOTATION_CAPTURE:
      type: "capture"
      document_id: "machine_quotation"
      manifest_id: "doc_machine_quote_001"
      page_id: "page_1"
      multipage: true
      max_pages: 5
      text_template: "यदि आपके पास मशीनों का कोटेशन (Price Estimate) उपलब्ध है, तो कृपया उसकी फोटो लें या आगे बढ़ें।"
      text_template_en: "If you have machinery quotation/estimate documents available, please take a photo now or proceed."
      text_template_mr: "तुमच्याकडे मशीनचे कोटेशन असल्यास फोटो घ्या किंवा पुढे जा."
      targets: ["machine_quotations"]
      edges:
        - condition: "always"
          next: "Q_PRODUCTS_TO_SELL"


    Q_PRODUCTS_TO_SELL:
      type: "voice-qa"
      text_template: "आप कौन-कौन से तैयार उत्पाद या सामान बनाकर बेचेंगे?"
      text_template_en: "What specific products will you manufacture/process and sell?"
      text_template_mr: "तुम्ही कोणकोणती उत्पादने तयार करून विकणार आहात?"
      targets: ["products_to_sell"]
      edges:
        - condition: "always"
          next: "Q_PRODUCT_RATES_UNITS"

    Q_PRODUCT_RATES_UNITS:
      type: "voice-qa"
      text_template: "हर महीने लगभग कितना सामान बेचने का अनुमान है और उसे किस दर या कीमत पर बेचेंगे?"
      text_template_en: "What is the expected monthly sales volume for each product and at what selling price per unit?"
      text_template_mr: "दरमहा किती माल विकण्याचा अंदाज आहे आणि त्याची विक्री किंमत काय असेल?"
      targets: ["product_monthly_units", "product_rate_per_unit"]
      edges:
        - condition: "always"
          next: "Q_RAW_MATERIALS"

    Q_RAW_MATERIALS:
      type: "voice-qa"
      text_template: "इस उत्पाद को बनाने के लिए कौन-कौन सा कच्चा माल (Raw Material) लगेगा?"
      text_template_en: "What raw materials and ingredients are required for your food products?"
      text_template_mr: "हा माल तयार करण्यासाठी कोणता कच्चा माल लागेल?"
      targets: ["raw_materials_required"]
      routing_prompt: "Accept whatever raw materials or input expenses the applicant states (including cattle feed, fodder, agricultural produce, or self-sourced inputs). If the applicant confirms their raw materials or indicates that nothing else is required, accept immediately without asking follow-up questions or debating ingredients."
      edges:
        - condition: "always"
          next: "Q_RAW_MATERIAL_RATES_QTY"

    Q_RAW_MATERIAL_RATES_QTY:
      type: "voice-qa"
      text_template: "हर महीने लगभग कितना कच्चा माल लगेगा और उसकी प्रति इकाई कीमत क्या होगी?"
      text_template_en: "How much raw material quantity is required monthly and what is its purchase rate per unit?"
      text_template_mr: "दरमहा किती कच्चा माल लागेल आणि त्याचा दर काय असेल?"
      targets: ["raw_material_monthly_qty", "raw_material_rate_per_unit"]
      edges:
        - condition: "always"
          next: "Q_WORKING_CAPITAL"

    Q_WORKING_CAPITAL:
      type: "voice-qa"
      text_template: "दैनिक खर्चों जैसे कच्चा माल खरीदने और मजदूरी के लिए क्या आपको वर्किंग कैपिटल लोन की ज़रूरत है?"
      text_template_en: "Do you need a working capital loan for day-to-day operational expenses like raw materials and labor?"
      text_template_mr: "कच्चा माल आणि मजुरीसाठी तुम्हाला वर्किंग कॅपिटल कर्जाची आवश्यकता आहे का?"
      targets: ["working_capital_loan_needed"]
      edges:
        - condition: "always"
          next: "Q_HAS_WORKERS"

    Q_HAS_WORKERS:
      type: "voice-qa"
      text_template: "क्या आपके इस काम में आपके अलावा अन्य कर्मचारी या मजदूर भी काम करेंगे?"
      text_template_en: "Will any other workers, helpers, or employees be working with you in this business?"
      text_template_mr: "तुमच्या या व्यवसायात तुमच्या व्यतिरिक्त इतर कामगार किंवा कर्मचारी काम करतील का?"
      targets: ["has_workers"]
      edges:
        - condition: "has_workers in ['no', 'No', 'False', 'false']"
          next: "Q_INTERVIEW_CLOSING"
        - condition: "always"
          next: "Q_WORKER_ROLES"

    Q_WORKER_ROLES:
      type: "voice-qa"
      text_template: "कुल कितने कर्मचारी काम करेंगे और वे क्या-क्या काम संभालेंगे?"
      text_template_en: "How many total workers will be employed and what specific job roles or duties will they handle?"
      text_template_mr: "एकूण किती कामगार काम करतील आणि ते कोणती कामे सांभाळतील?"
      targets: ["total_workers", "worker_roles", "new_employment_generated", "num_skilled_workers", "num_unskilled_workers"]
      edges:
        - condition: "always"
          next: "Q_WORKER_WAGES"

    Q_WORKER_WAGES:
      type: "voice-qa"
      text_template: "उन्हें हर महीने कुल मिलाकर लगभग कितनी तनख़्वाह या मजदूरी देंगे?"
      text_template_en: "What approximate monthly wages or salary will you pay them in total?"
      text_template_mr: "त्यांना दरमहा एकूण अंदाजे किती पगार किंवा मजुरी द्याल?"
      targets: ["wages_skilled_per_month", "wages_unskilled_per_month"]
      edges:
        - condition: "always"
          next: "Q_INTERVIEW_CLOSING"

    Q_INTERVIEW_CLOSING:
      type: "voice-qa"
      text_template: "बहुत बढ़िया! आपने व्यवसाय की पूरी जानकारी दे दी है। अब अंतिम चरण में कार्यस्थल की वीडियो रिकॉर्डिंग करेंगे।"
      text_template_en: "Excellent! You have provided all business details. The final step is video recording of your business workplace."
      text_template_mr: "उत्तम! तुम्ही सर्व माहिती दिली आहे. आता शेवटच्या टप्प्यात कामाच्या जागेचे व्हिडिओ रेकॉर्डिंग करूया."
      targets: []
      edges:
        - condition: "always"
          next: "DOC_WORKPLACE_VIDEO"

    # ─── Phase 3: GeoTag Video Verification ───
    DOC_WORKPLACE_VIDEO:
      type: "video_capture"
      document_id: "workplace_video"
      text_template: "कृपया अपने कार्यस्थल का 30 सेकंड का वीडियो बनाएं।"
      text_template_mr: "कृपया आपल्या कामाच्या जागेचा ३० सेकंदाचा व्हिडिओ बनवा."
      text_template_en: "Please record a 30-second video of your workplace."
      geo_tagged: true
      max_duration_seconds: 30
      instructions:
        - offset_seconds: 0
          text: "कृपया कैमरे को चालू करें और अपनी दुकान/कारखाने के चारों ओर घुमाकर अपना वर्कप्लेस दिखाएं।"
          text_hi: "कृपया कैमरे को चालू करें और अपनी दुकान/कारखाने के चारों ओर घुमाकर अपना वर्कप्लेस दिखाएं।"
          text_en: "Please turn on the camera and pan around your food processing unit to show your workplace."
          text_mr: "कृपया कॅमेरा सुरू करा आणि आपल्या कारखान्याच्या सर्व बाजूंनी फिरवून कामाची जागा दाखवा."
        - offset_seconds: 10
          text: "अब मुख्य मशीनरी, उपकरण या माल वाले हिस्से को करीब से दिखाएं।"
          text_hi: "अब मुख्य मशीनरी, उपकरण या माल वाले हिस्से को करीब से दिखाएं।"
          text_en: "Now show the main machineries, equipment, or stock area up close."
          text_mr: "आता मुख्य मशिन्स किंवा साठवणुकीचा भाग जवळून दाखवा."
        - offset_seconds: 20
          text: "धन्यवाद। अब वीडियो रिकॉर्डिंग समाप्त कर सकते हैं।"
          text_hi: "धन्यवाद। अब वीडियो रिकॉर्डिंग समाप्त कर सकते हैं।"
          text_en: "Thank you. You may now complete the video recording."
      edges:
        - condition: "always"
          next: "COMPLETE"

    COMPLETE:
      type: "status"
      text_template: "बधाई हो! आपका PMFME आवेदन सफलतापूर्वक पूरा हो गया है।"
      text_template_en: "Congratulations! Your PMFME application is successfully complete."
      text_template_mr: "अभिनंदन! तुमचा PMFME अर्ज यशस्वीरित्या पूर्ण झाला आहे."
      edges: []

